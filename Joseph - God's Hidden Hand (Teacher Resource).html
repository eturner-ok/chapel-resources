00);\">The one nobody would pick<\u002Fdiv><div style=\"margin-top:12px; border-top:1.5px solid var(--color-text);\">\n<div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:8px 0; border-bottom:1px solid var(--color-neutral-300); font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-neutral-700);\"><div>Chosen · younger<\u002Fdiv><div>Passed over · older<\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{ younger }}\" as=\"y\" hint-placeholder-count=\"5\"><div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--color-neutral-300); font-size:17px;\"><div style=\"font-family:var(--font-heading); font-weight:600; color:var(--color-accent-800);\">{{ y.a }}<\u002Fdiv><div style=\"color:var(--color-neutral-700);\">{{ y.b }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv><\u002Ffigure>\n<h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">A burial and a promise<\u002Fh3>\n<p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">Jacob makes Joseph swear to bury him in Canaan, in the cave Abraham bought (49:29–32; <span sc-camel-on-click=\"{{ v.g50_13 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">50:13<\u002Fspan>). Even in death, he’s saying where home is.<\u002Fp>\n<p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">Joseph does the same thing, with a twist. He doesn’t ask to be carried back right away. He tells his brothers, “God will surely visit you and bring you up out of this land,” and makes them swear to take his bones when that day comes (<span sc-camel-on-click=\"{{ v.g50_25 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">50:24–25<\u002Fspan>). He says “God will surely visit you” twice. Then he’s embalmed and left in Egypt, a coffin that sat there for centuries as a standing reminder that Egypt wasn’t home (Baldwin, <em>The Message of Genesis 12–50<\u002Fem>).<\u002Fp>\n<p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">The promise holds. When Israel leaves Egypt, Moses carries Joseph’s bones (<span sc-camel-on-click=\"{{ v.ex13_19 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Ex 13:19<\u002Fspan>). When they reach the land, they bury him at Shechem, on the plot of ground Jacob had bought there years before (<span sc-camel-on-click=\"{{ v.josh24_32 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Josh 24:32<\u002Fspan>; <span sc-camel-on-click=\"{{ v.g33_19 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 33:19<\u002Fspan>). Joseph’s story started when his father sent him to Shechem to find his brothers. It ends with him buried there. Hebrews singles out this moment as Joseph’s great act of faith: he gave directions about his bones, trusting a promise he’d never see kept (<span sc-camel-on-click=\"{{ v.heb11_22 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Heb 11:22<\u002Fspan>).<\u002Fp>\n<figure style=\"margin:30px 0 8px;\"><div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">The journey of Joseph’s bones<\u002Fdiv><div style=\"display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-top:14px; border-top:1.5px solid var(--color-text);\">\n<sc-for list=\"{{ bones }}\" as=\"b\" hint-placeholder-count=\"4\"><div style=\"padding:14px 14px 16px 0; display:flex; flex-direction:column; gap:6px;\"><span sc-camel-on-click=\"{{ b.read }}\" style=\"cursor:pointer; align-self:flex-start; font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">{{ b.ref }}<\u002Fspan><div style=\"font-family:var(--font-heading); font-weight:600; font-size:17px; line-height:1.25;\">{{ b.label }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv><\u002Ffigure>\n<p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">“God will surely visit you” is the hope the Old Testament ends on, waiting in expectant silence (Kidner, <em>Genesis<\u002Fem>). It’s the promise the New Testament opens by keeping: “he has visited and redeemed his people” (<span sc-camel-on-click=\"{{ v.lk1_68 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Luke 1:68<\u002Fspan>).<\u002Fp>\n<div style=\"margin:36px 0 0; padding:20px 24px 22px; background:var(--color-accent-2-100);\"><div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-accent-2-800);\">Connecting the Dots<\u002Fdiv><p style=\"font-size:17px; line-height:1.62; margin:8px 0 0; color:var(--color-accent-2-900); text-wrap:pretty;\">Joseph died believing a promise he knew he wouldn’t live to see. That’s a hard kind of faith, and middle schoolers rarely get shown it. Most of what they hope for, they expect to see almost instantly. Joseph trusted God for something centuries out, and God kept his promise to the letter. So ask them: what are you trusting God for that might take longer than you want?<\u002Fp><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ ch.c7 }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">The takeaway<\u002Fdiv>\n<p style=\"font-family:var(--font-heading); font-weight:600; font-size:34px; line-height:1.22; margin:16px 0 0; max-width:22em; text-wrap:balance;\">God did some of his biggest work in Genesis in the chapters where he said the least. <span style=\"color:var(--color-accent-700);\">If a student walks out of chapel knowing that God can be silent and still be steering, they’ve got the whole book.<\u002Fspan><\u002Fp>\n<h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">If you want to watch or read more<\u002Fh3>\n<div style=\"display:flex; flex-direction:column; gap:12px; margin:18px 0 0;\">\n<div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\"><a href=\"https://bibleproject.com/videos/genesis-12-50/\" target=\"_blank\">BibleProject: Genesis 12–50 overview video<\u002Fa>. It ends on 50:20 and the promised king from Judah. Good to show a class.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\"><a href=\"https://bibleproject.com/classroom/joseph/\" target=\"_blank\">BibleProject: <em>Joseph<\u002Fem> class<\u002Fa>. A free 29-session course. Session 6 (“A Man in the Field”) covers the stranger at Shechem, and sessions 16 and 23 cover Judah as substitute and the Judah and Joseph link.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\"><a href=\"https://www.gotquestions.org/God-meant-it-for-good.html\" target=\"_blank\">GotQuestions: “You meant evil against me, but God meant it for good”<\u002Fa>. A short, clear take on 50:20 and God keeping his covenant promises.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\"><a href=\"https://www.gotquestions.org/typology-Biblical.html\" target=\"_blank\">GotQuestions: “What is biblical typology?”<\u002Fa>. Helpful for section 6. It treats Joseph as an illustration of Christ rather than an explicit type.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">Sources referenced above<\u002Fh3>\n<div style=\"display:flex; flex-direction:column; gap:8px; margin-top:14px; font-size:15px; line-height:1.5; color:var(--color-neutral-800);\">\n<p style=\"margin:0;\">Joyce G. Baldwin, <em>The Message of Genesis 12–50<\u002Fem>, The Bible Speaks Today (Downers Grove: InterVarsity Press, 1986).<\u002Fp>\n<p style=\"margin:0;\">Tony Evans, <em>The Tony Evans Bible Commentary<\u002Fem> (Nashville: Holman Bible Publishers, 2019).<\u002Fp>\n<p style=\"margin:0;\">Kenneth O. Gangel and Stephen J. Bramer, <em>Genesis<\u002Fem>, ed. Max Anders, Holman Old Testament Commentary (Nashville: B&amp;H, 2002).<\u002Fp>\n<p style=\"margin:0;\">Derek Kidner, <em>Genesis: An Introduction and Commentary<\u002Fem>, Tyndale Old Testament Commentaries (Downers Grove: InterVarsity Press, 1967).<\u002Fp>\n<p style=\"margin:0;\">K. A. Mathews, <em>Genesis 11:27–50:26<\u002Fem>, New American Commentary (Nashville: Broadman &amp; Holman, 2005).<\u002Fp>\n<p style=\"margin:0;\">R. W. L. Moberly, <em>Genesis 12–50<\u002Fem>, Old Testament Guides (Sheffield: Sheffield Academic Press, 1995).<\u002Fp>\n<p style=\"margin:0;\">Allen P. Ross, “Genesis,” in <em>Cornerstone Biblical Commentary<\u002Fem>, vol. 1, <em>Genesis, Exodus<\u002Fem> (Carol Stream: Tyndale House, 2008).<\u002Fp>\n<p style=\"margin:0;\">John H. Walton, <em>Genesis<\u002Fem>, NIV Application Commentary (Grand Rapids: Zondervan, 2001).<\u002Fp>\n<p style=\"margin:0;\"><a href=\"https://bibleproject.com/videos/genesis-12-50/\" target=\"_blank\">BibleProject, “Genesis 12–50” overview video<\u002Fa>.<\u002Fp>\n<p style=\"margin:0;\"><a href=\"https://bibleproject.com/classroom/joseph/\" target=\"_blank\">BibleProject, <em>Joseph<\u002Fem> class (Tim Mackie)<\u002Fa>.<\u002Fp>\n<p style=\"margin:0;\"><a href=\"https://www.gotquestions.org/God-meant-it-for-good.html\" target=\"_blank\">GotQuestions, “What did Joseph mean when he said, ‘You meant evil against me, but God meant it for good’?”<\u002Fa><\u002Fp>\n<p style=\"margin:0;\"><a href=\"https://www.gotquestions.org/typology-Biblical.html\" target=\"_blank\">GotQuestions, “What is biblical typology?”<\u002Fa><\u002Fp>\n<p style=\"margin:0;\"><a href=\"https://www.theologyofwork.org/old-testament/genesis-12-50-and-work/joseph-genesis-372-5026/\" target=\"_blank\">Theology of Work Project, “Joseph (Genesis 37:2–50:26)”<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n        <div style=\"display:flex; justify-content:space-between; gap:12px; margin-top:56px; padding-top:18px; border-top:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ deepPrev }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:8px 0; text-align:left; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700); max-width:45%;\" style-hover=\"color:var(--color-accent-900);\">{{ deepPrevLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deepNext }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:8px 0; text-align:right; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700); max-width:45%;\" style-hover=\"color:var(--color-accent-900);\">{{ deepNextLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"max-width:1120px; margin:0 auto; padding:0 40px 48px;\">\n    <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; padding-top:20px; border-top:1.5px solid var(--color-text);\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-accent-2-700);\">COMING UP NEXTON NOVEMBER 4<\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.6; margin:8px 0 0;\">Exodus 1: “Now there arose a new king over Egypt, who did not know Joseph” (<span sc-camel-on-click=\"{{ v.ex1_8 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Ex 1:8<\u002Fspan>). The family that came for food stays about four hundred years, and the promise Joseph died holding onto (“God will surely visit you,” <span sc-camel-on-click=\"{{ v.g50_25 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 50:25<\u002Fspan>) is about to be kept.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-accent-700);\">Going Deeper<\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.6; margin:8px 0 0;\">The Going Deeper document covers where God is in a story where he never appears, whether Joseph was a spoiled brat or a hero, why Judah and Tamar interrupt the story, why Joseph tested his brothers, how the story fits real Egyptian history, whether Joseph is a picture of Jesus, and why Genesis ends with a coffin.<\u002Fp>\n        <button sc-camel-on-click=\"{{ setDeep }}\" style=\"appearance:none; border:none; background:transparent; padding:0; margin-top:10px; cursor:pointer; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700); border-bottom:1px solid var(--color-accent);\" style-hover=\"color:var(--color-accent-900);\">Open Going Deeper →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <p style=\"font-size:12px; line-height:1.5; margin:28px 0 0; color:var(--color-neutral-700);\">Unless otherwise indicated, Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.<\u002Fp>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ popOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closePop }}\" style=\"position:fixed; inset:0; z-index:40;\"><\u002Fdiv>\n    <div style=\"position:fixed; z-index:41; left:{{ popLeft }}; top:{{ popTop }}; bottom:{{ popBottom }}; width:340px; max-height:60vh; overflow:auto; padding:18px 20px 16px; background:#fff; border-top:3px solid {{ popColor }}; box-shadow:var(--shadow-lg);\">\n      <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px;\">\n        <div style=\"font-family:var(--font-heading); font-weight:600; font-size:19px;\">{{ popTitle }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closePop }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; font-size:20px; line-height:1; color:var(--color-neutral-700); padding:0;\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:16px; line-height:1.55; margin:10px 0 0;\">{{ popText }}<\u002Fp>\n      <div style=\"font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-top:10px; color:var(--color-neutral-600);\">{{ popFoot }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTimeline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst VERSES = {\n  g15_13: ['Genesis 15:13', 'Then the LORD said to Abram, “Know for certain that your offspring will be sojourners in a land that is not theirs and will be servants there, and they will be afflicted for four hundred years.”'],\n  g50_20: ['Genesis 50:20', 'As for you, you meant evil against me, but God meant it for good, to bring it about that many people should be kept alive, as they are today.'],\n  g44_33: ['Genesis 44:33', 'Now therefore, please let your servant remain instead of the boy as a servant to my lord, and let the boy go back with his brothers.'],\n  g49_10: ['Genesis 49:10', 'The scepter shall not depart from Judah, nor the ruler’s staff from between his feet, until tribute comes to him; and to him shall be the obedience of the peoples.'],\n  mt1_2: ['Matthew 1:2–3', 'Abraham was the father of Isaac, and Isaac the father of Jacob, and Jacob the father of Judah and his brothers, and Judah the father of Perez and Zerah by Tamar, and Perez the father of Hezron, and Hezron the father of Ram.'],\n  g38_26: ['Genesis 38:26', 'Then Judah identified them and said, “She is more righteous than I, since I did not give her to my son Shelah.” And he did not know her again.'],\n  g37_12: ['Genesis 37:12–14', 'Now his brothers went to pasture their father’s flock near Shechem. And Israel said to Joseph, “Are not your brothers pasturing the flock at Shechem? Come, I will send you to them.” And he said to him, “Here I am.” So he said to him, “Go now, see if it is well with your brothers and with the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.'],\n  josh24_32: ['Joshua 24:32', 'As for the bones of Joseph, which the people of Israel brought up from Egypt, they buried them at Shechem, in the piece of land that Jacob bought from the sons of Hamor the father of Shechem for a hundred pieces of money. It became an inheritance of the descendants of Joseph.'],\n  g37_20: ['Genesis 37:20', 'Come now, let us kill him and throw him into one of the pits. Then we will say that a fierce animal has devoured him, and we will see what will become of his dreams.'],\n  g39_2: ['Genesis 39:2', 'The LORD was with Joseph, and he became a successful man, and he was in the house of his Egyptian master.'],\n  g39_21: ['Genesis 39:21', 'But the LORD was with Joseph and showed him steadfast love and gave him favor in the sight of the keeper of the prison.'],\n  g41_40: ['Genesis 41:40–43', 'You shall be over my house, and all my people shall order themselves as you command. Only as regards the throne will I be greater than you.” And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.” Then Pharaoh took his signet ring from his hand and put it on Joseph’s hand, and clothed him in garments of fine linen and put a gold chain about his neck. And he made him ride in his second chariot. And they called out before him, “Bow the knee!” Thus he set him over all the land of Egypt.'],\n  g47_6: ['Genesis 47:6', 'The land of Egypt is before you. Settle your father and your brothers in the best of the land. Let them settle in the land of Goshen, and if you know any able men among them, put them in charge of my livestock.'],\n  ex1_8: ['Exodus 1:8', 'Now there arose a new king over Egypt, who did not know Joseph.'],\n  g50_25: ['Genesis 50:24–26', 'And Joseph said to his brothers, “I am about to die, but God will visit you and bring you up out of this land to the land that he swore to Abraham, to Isaac, and to Jacob.” Then Joseph made the sons of Israel swear, saying, “God will surely visit you, and you shall carry up my bones from here.” So Joseph died, being 110 years old. They embalmed him, and he was put in a coffin in Egypt.'],\n  g46_2: ['Genesis 46:2–4', 'And God spoke to Israel in visions of the night and said, “Jacob, Jacob.” And he said, “Here I am.” Then he said, “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation. I myself will go down with you to Egypt, and I will also bring you up again, and Joseph’s hand shall close your eyes.”'],\n  g37_15: ['Genesis 37:15–17', 'And a man found him wandering in the fields. And the man asked him, “What are you seeking?” “I am seeking my brothers,” he said. “Tell me, please, where they are pasturing the flock.” And the man said, “They have gone away, for I heard them say, ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.'],\n  g37_25: ['Genesis 37:25', 'Then they sat down to eat. And looking up they saw a caravan of Ishmaelites coming from Gilead, with their camels bearing gum, balm, and myrrh, on their way to carry it down to Egypt.'],\n  g37_28: ['Genesis 37:28', 'Then Midianite traders passed by. And they drew Joseph up and lifted him out of the pit, and sold him to the Ishmaelites for twenty shekels of silver. They took Joseph to Egypt.'],\n  g41_1: ['Genesis 41:1', 'After two whole years, Pharaoh dreamed that he was standing by the Nile.'],\n  g41_32: ['Genesis 41:32', 'And the doubling of Pharaoh’s dream means that the thing is fixed by God, and God will shortly bring it about.'],\n  g45_5: ['Genesis 45:5–8', 'And now do not be distressed or angry with yourselves because you sold me here, for God sent me before you to preserve life. For the famine has been in the land these two years, and there are yet five years in which there will be neither plowing nor harvest. And God sent me before you to preserve for you a remnant on earth, and to keep alive for you many survivors. So it was not you who sent me here, but God. He has made me a father to Pharaoh, and lord of all his house and ruler over all the land of Egypt.'],\n  g37_2: ['Genesis 37:2', 'These are the generations of Jacob. Joseph, being seventeen years old, was pasturing the flock with his brothers. He was a boy with the sons of Bilhah and Zilpah, his father’s wives. And Joseph brought a bad report of them to their father.'],\n  g37_3: ['Genesis 37:3', 'Now Israel loved Joseph more than any other of his sons, because he was the son of his old age. And he made him a robe of many colors.'],\n  g37_9: ['Genesis 37:9–10', 'Then he dreamed another dream and told it to his brothers and said, “Behold, I have dreamed another dream. Behold, the sun, the moon, and eleven stars were bowing down to me.” But when he told it to his father and to his brothers, his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow ourselves to the ground before you?”'],\n  g41_57: ['Genesis 41:57', 'Moreover, all the earth came to Egypt to Joseph to buy grain, because the famine was severe over all the earth.'],\n  g12_3: ['Genesis 12:3', 'I will bless those who bless you, and him who dishonors you I will curse, and in you all the families of the earth shall be blessed.'],\n  g2_9: ['Genesis 2:9', 'And out of the ground the LORD God made to spring up every tree that is pleasant to the sight and good for food. The tree of life was in the midst of the garden, and the tree of the knowledge of good and evil.'],\n  g42_24: ['Genesis 42:24', 'Then he turned away from them and wept. And he returned to them and spoke to them. And he took Simeon from them and bound him before their eyes.'],\n  g38_25: ['Genesis 38:25', 'As she was being brought out, she sent word to her father-in-law, “By the man to whom these belong, I am pregnant.” And she said, “Please identify whose these are, the signet and the cord and the staff.”'],\n  g37_32: ['Genesis 37:32', 'And they sent the robe of many colors and brought it to their father and said, “This we have found; please identify whether it is your son’s robe or not.”'],\n  g42_8: ['Genesis 42:8', 'And Joseph recognized his brothers, but they did not recognize him.'],\n  g38_27: ['Genesis 38:27–30', 'When the time of her labor came, there were twins in her womb. And when she was in labor, one put out a hand, and the midwife took and tied a scarlet thread on his hand, saying, “This one came out first.” But as he drew back his hand, behold, his brother came out. And she said, “What a breach you have made for yourself!” Therefore his name was called Perez. Afterward his brother came out with the scarlet thread on his hand, and his name was called Zerah.'],\n  ruth4_18: ['Ruth 4:18–22', 'Now these are the generations of Perez: Perez fathered Hezron, Hezron fathered Ram, Ram fathered Amminadab, Amminadab fathered Nahshon, Nahshon fathered Salmon, Salmon fathered Boaz, Boaz fathered Obed, Obed fathered Jesse, and Jesse fathered David.'],\n  g37_26: ['Genesis 37:26–27', 'Then Judah said to his brothers, “What profit is it if we kill our brother and conceal his blood? Come, let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother, our own flesh.” And his brothers listened to him.'],\n  g43_9: ['Genesis 43:9', 'I will be a pledge of his safety. From my hand you shall require him. If I do not bring him back to you and set him before you, then let me bear the blame forever.'],\n  g42_9: ['Genesis 42:9', 'And Joseph remembered the dreams that he had dreamed of them. And he said to them, “You are spies; you have come to see the nakedness of the land.”'],\n  g43_34: ['Genesis 43:34', 'Portions were taken to them from Joseph’s table, but Benjamin’s portion was five times as much as any of theirs. And they drank and were merry with him.'],\n  g42_21: ['Genesis 42:21', 'Then they said to one another, “In truth we are guilty concerning our brother, in that we saw the distress of his soul, when he begged us and we did not listen. That is why this distress has come upon us.”'],\n  g45_1: ['Genesis 45:1–2', 'Then Joseph could not control himself before all those who stood by him. He cried, “Make everyone go out from me.” So no one stayed with him when Joseph made himself known to his brothers. And he wept aloud, so that the Egyptians heard it, and the household of Pharaoh heard it.'],\n  g45_4: ['Genesis 45:4', 'So Joseph said to his brothers, “Come near to me, please.” And they came near. And he said, “I am your brother, Joseph, whom you sold into Egypt.”'],\n  g47_28: ['Genesis 47:28', 'And Jacob lived in the land of Egypt seventeen years. So the days of Jacob, the years of his life, were 147 years.'],\n  g50_15: ['Genesis 50:15', 'When Joseph’s brothers saw that their father was dead, they said, “It may be that Joseph will hate us and pay us back for all the evil that we did to him.”'],\n  g50_17: ['Genesis 50:16–17', 'So they sent a message to Joseph, saying, “Your father gave this command before he died: ‘Say to Joseph, “Please forgive the transgression of your brothers and their sin, because they did evil to you.”’ And now, please forgive the transgression of the servants of the God of your father.” Joseph wept when they spoke to him.'],\n  g50_19: ['Genesis 50:19', 'But Joseph said to them, “Do not fear, for am I in the place of God?”'],\n  g50_21: ['Genesis 50:21', 'So do not fear; I will provide for you and your little ones.” Thus he comforted them and spoke kindly to them.'],\n  g41_14: ['Genesis 41:14', 'Then Pharaoh sent and called Joseph, and they quickly brought him out of the pit. And when he had shaved himself and changed his clothes, he came in before Pharaoh.'],\n  g50_3: ['Genesis 50:3', 'Forty days were required for it, for that is how many are required for embalming. And the Egyptians wept for him seventy days.'],\n  g47_25: ['Genesis 47:25', 'And they said, “You have saved our lives; may it please my lord, we will be servants to Pharaoh.”'],\n  acts7_9: ['Acts 7:9', 'And the patriarchs, jealous of Joseph, sold him into Egypt; but God was with him.'],\n  acts2_23: ['Acts 2:23', 'This Jesus, delivered up according to the definite plan and foreknowledge of God, you crucified and killed by the hands of lawless men.'],\n  g50_26: ['Genesis 50:26', 'So Joseph died, being 110 years old. They embalmed him, and he was put in a coffin in Egypt.'],\n  g48_14: ['Genesis 48:13–14', 'And Joseph took them both, Ephraim in his right hand toward Israel’s left hand, and Manasseh in his left hand toward Israel’s right hand, and brought them near him. And Israel stretched out his right hand and laid it on the head of Ephraim, who was the younger, and his left hand on the head of Manasseh, crossing his hands (for Manasseh was the firstborn).'],\n  g48_19: ['Genesis 48:19', 'But his father refused and said, “I know, my son, I know. He also shall become a people, and he also shall be great. Nevertheless, his younger brother shall be greater than he, and his offspring shall become a multitude of nations.”'],\n  g50_13: ['Genesis 50:13', 'For his sons carried him to the land of Canaan and buried him in the cave of the field at Machpelah, to the east of Mamre, which Abraham bought with the field from Ephron the Hittite to possess as a burying place.'],\n  ex13_19: ['Exodus 13:19', 'Moses took the bones of Joseph with him, for Joseph had made the sons of Israel solemnly swear, saying, “God will surely visit you, and you shall carry up my bones with you from here.”'],\n  g33_19: ['Genesis 33:19', 'And from the sons of Hamor, Shechem’s father, he bought for a hundred pieces of money the piece of land on which he had pitched his tent.'],\n  heb11_22: ['Hebrews 11:22', 'By faith Joseph, at the end of his life, made mention of the exodus of the Israelites and gave directions concerning his bones.'],\n  lk1_68: ['Luke 1:68', 'Blessed be the Lord God of Israel, for he has visited and redeemed his people.'],\n  g42_6: ['Genesis 42:6', 'Now Joseph was governor over the land. He was the one who sold to all the people of the land. And Joseph’s brothers came and bowed themselves before him with their faces to the ground.']\n};\nconst TERMS = {\n  providence: ['Providence', 'God guiding events toward his purposes, usually through ordinary people and timing rather than miracles.'],\n  vizier: ['Vizier', 'Egypt’s highest official under Pharaoh. Genesis doesn’t use the word, but it’s the closest match to Joseph’s role (Gen 41:40–43).'],\n  goshen: ['Goshen', 'the region of Egypt where Jacob’s family settles (Gen 47:6).'],\n  typology: ['Typology', 'reading a person or event in the Old Testament as a pattern that points ahead to Christ.'],\n  raah: ['ra’ah', 'Hebrew for “evil” or “bad.” It’s the “bad report” of 37:2 and the “evil” of 50:20.'],\n  tovah: ['tovah', 'Hebrew for “good.” Paired with ra’ah since the tree of the knowledge of good and evil (Gen 2:9).'],\n  nakar: ['nakar', 'Hebrew for “recognize” or “identify.” It links the bloody robe (37:32), Tamar’s proof (38:25), and Joseph recognizing his brothers (42:8).']\n};\nconst KEY_TERMS = ['providence', 'vizier', 'goshen', 'typology'];\nconst TABS = ['Overview', 'The Journey', 'If A Student Asks', 'Heads Up', 'Fun Fact', 'Connecting the Dots', 'Key Terms'];\nconst ARC = [\n  { label: 'Dreams & the pit', ref: 'Gen. 37', verse: 'g37_28', note: 'Jacob’s favorite son tells his brothers two dreams about them bowing to him. They throw him in a pit and sell him to traders headed for Egypt.' },\n  { label: 'Potiphar & prison', ref: 'Gen. 39–40', verse: 'g39_21', note: 'Joseph rises in Potiphar’s house, gets lied about by his boss’s wife, and lands in prison. A cupbearer he helps there forgets him.' },\n  { label: 'The palace', ref: 'Gen. 41', verse: 'g41_40', note: 'Two years later, Pharaoh has a dream nobody can explain. Joseph explains it and is put in charge of all Egypt.' },\n  { label: 'The tests', ref: 'Gen. 42–44', verse: 'g44_33', note: 'Famine brings the brothers to Egypt. They bow to a governor they don’t recognize. Joseph tests them until Judah offers himself in Benjamin’s place.' },\n  { label: '“I am Joseph”', ref: 'Gen. 45', verse: 'g45_4', note: 'Joseph can’t hold it in any longer. He tells his brothers who he is, weeps, and tells them God sent him ahead of them.' },\n  { label: 'Goshen', ref: 'Gen. 46–47', verse: 'g46_2', note: 'God tells Jacob not to be afraid to go down to Egypt. The family settles in Goshen.' },\n  { label: 'The coffin', ref: 'Gen. 48–50', verse: 'g50_20', note: 'Jacob blesses his sons and dies. Joseph forgives his brothers again and dies asking to be carried home someday.' }\n];\nconst W = 760, H = 505;\nconst rad = d => d * Math.PI / 180;\nconst MX = l => rad(l), MY = p => -Math.log(Math.tan(Math.PI / 4 + rad(p) / 2));\nconst X0 = MX(30.2), X1 = MX(36.2), Y0 = MY(33.0), Y1 = MY(29.6);\nconst K = Math.min(W / (X1 - X0), H / (Y1 - Y0));\nconst TX = (W - K * (X1 + X0)) / 2, TY = (H - K * (Y1 + Y0)) / 2;\nconst proj = ([lo, la]) => [K * MX(lo) + TX, K * MY(la) + TY];\nconst LL = { hebron: [35.10, 31.53], shechem: [35.28, 32.21], dothan: [35.24, 32.41], beersheba: [34.79, 31.25], on: [31.31, 30.13], goshen: [31.95, 30.6] };\nconst KINDS = {\n  joseph: { label: 'Joseph · Gen. 37', stroke: 'var(--color-accent)', w: 2.6, dash: '7 5' },\n  trips: { label: 'Brothers’ grain trips · Gen. 42–45', stroke: 'var(--color-neutral-600)', w: 2, dash: '2 4' },\n  family: { label: 'Family moves to Egypt · Gen. 46', stroke: 'var(--color-text)', w: 2.2, dash: 'none' },\n  funeral: { label: 'Jacob carried home · Gen. 50', stroke: 'var(--color-accent-800)', w: 2, dash: '10 3 2 3' }\n};\nconst LEGS = {\n  toShechem: { kind: 'joseph', pts: [LL.hebron, LL.shechem] },\n  toDothan: { kind: 'joseph', pts: [LL.shechem, LL.dothan] },\n  toEgypt: { kind: 'joseph', pts: [LL.dothan, [34.85, 31.9], [34.35, 31.42], [33.4, 31.13], [32.4, 30.9], LL.on] },\n  trips: { kind: 'trips', pts: [LL.hebron, [34.5, 31.22], [33.6, 30.92], [32.5, 30.6], LL.on] },\n  toBeersheba: { kind: 'family', pts: [LL.hebron, LL.beersheba] },\n  toGoshen: { kind: 'family', pts: [LL.beersheba, [33.9, 30.78], [32.9, 30.55], LL.goshen] },\n  funeral: { kind: 'funeral', pts: [LL.goshen, [32.9, 30.7], [33.9, 30.98], [34.6, 31.3], LL.hebron] }\n};\nconst legPath = k => { const p = LEGS[k].pts.map(proj); return segs(p, 0, p.length - 1); };\nconst f = n => n.toFixed(1);\nfunction segs(pts, from, to) {\n  let d = `M${f(pts[from][0])},${f(pts[from][1])}`;\n  for (let i = from; i < to; i++) {\n    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];\n    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];\n    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];\n    d += ` C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;\n  }\n  return d;\n}\nconst PLACES = {\n  dothan: { name: 'Dothan', sub: 'the pit · Gen. 37:17', dx: -14, dy: -18, left: true },\n  shechem: { name: 'Shechem', sub: 'Gen. 37; Josh. 24', dx: -14, dy: 8, left: true },\n  hebron: { name: 'Hebron', sub: 'Gen. 37; 50', dx: -14, dy: 0, left: true },\n  beersheba: { name: 'Beersheba', sub: 'Gen. 46:1–4', dx: -14, dy: 22, left: true },\n  goshen: { name: 'Goshen', sub: 'Gen. 47:6', dx: 14, dy: -8, left: false },\n  on: { name: 'Egypt', sub: 'Gen. 39–41', dx: 14, dy: 14, left: false }\n};\nconst STEPS = [\n  { place: 'hebron', name: 'Hebron', when: 'Genesis 37 · sent to find his brothers', verse: 'g37_12', leg: null, note: 'Jacob sends seventeen-year-old Joseph from the Valley of Hebron to check on his brothers and bring back word.' },\n  { place: 'shechem', name: 'Shechem', when: 'Genesis 37 · a stranger in the field', verse: 'g37_15', leg: 'toShechem', note: 'His brothers aren’t there. A man finds Joseph wandering in the fields and points him to Dothan. ' },\n  { place: 'dothan', name: 'Dothan', when: 'Genesis 37 · the pit', verse: 'g37_28', leg: 'toDothan', note: 'The brothers strip off his robe, throw him in a pit, and sell him for twenty shekels of silver to traders on their way to Egypt.' },\n  { place: 'on', name: 'Egypt', when: 'Genesis 39–41 · Potiphar, prison, palace', verse: 'g41_40', leg: 'toEgypt', note: 'About thirteen years as a slave and a prisoner, then second in command of Egypt. Genesis doesn’t name the city. Joseph marries the daughter of a priest of On (41:45).' },\n  { place: 'hebron', name: 'Hebron to Egypt and back', when: 'Genesis 42–45 · the brothers’ trips', verse: 'g42_6', leg: 'trips', note: 'Famine sends the brothers to Egypt for grain, twice. They bow to a governor they don’t recognize. On the second trip he tells them who he is.' },\n  { place: 'beersheba', name: 'Beersheba', when: 'Genesis 46 · God speaks to Jacob', verse: 'g46_2', leg: 'toBeersheba', note: 'On the way down, God speaks to Jacob in a vision: “Do not be afraid to go down to Egypt.” It’s the only direct word from God in Genesis 37–50.' },\n  { place: 'goshen', name: 'Goshen', when: 'Genesis 46–47 · the family settles', verse: 'g47_6', leg: 'toGoshen', note: 'Pharaoh gives Jacob’s family the best of the land. They come down for food and stay for generations.' },\n  { place: 'hebron', name: 'Machpelah, near Hebron', when: 'Genesis 50 · Jacob is buried', verse: 'g50_13', leg: 'funeral', note: 'Jacob makes Joseph promise not to bury him in Egypt. His sons carry him home to the cave Abraham bought.' },\n  { place: 'shechem', name: 'Shechem, again', when: 'Joshua 24 · Joseph’s bones', verse: 'josh24_32', leg: null, note: 'Joseph asks to be carried home too, but not yet. Centuries later, Israel buries his bones at Shechem, where his story began.' }\n];\nconst JUDAH = [\n  { ref: 'Gen. 37:26–27', verse: 'g37_26', quote: '“Let us sell him”', note: 'Selling his brother for profit' },\n  { ref: 'Gen. 38:26', verse: 'g38_26', quote: '“She is more righteous than I”', note: 'Admitting he was wrong' },\n  { ref: 'Gen. 43:9', verse: 'g43_9', quote: '“I will be a pledge of his safety”', note: 'Putting his own life on the line' },\n  { ref: 'Gen. 44:33', verse: 'g44_33', quote: '“Let your servant remain instead of the boy”', note: 'Taking his brother’s place' }\n];\nconst PIVOTS = [\n  { ref: '37:15', verse: 'g37_15', label: 'A stranger in the field', looks: 'points Joseph to Dothan' },\n  { ref: '37:25', verse: 'g37_25', label: 'A caravan on time', looks: 'headed to Egypt as the brothers eat' },\n  { ref: '41:1', verse: 'g41_1', label: 'Two forgotten years', looks: 'until the cupbearer remembers' },\n  { ref: '41:32', verse: 'g41_32', label: 'A doubled dream', looks: '“fixed by God”' }\n];\nconst BONES = [\n  { ref: 'Gen. 50:25', verse: 'g50_25', label: 'Joseph makes them swear' },\n  { ref: 'Ex. 13:19', verse: 'ex13_19', label: 'Moses carries the bones' },\n  { ref: 'Josh. 24:32', verse: 'josh24_32', label: 'Buried at Shechem' },\n  { ref: 'Heb. 11:22', verse: 'heb11_22', label: 'Remembered as faith' }\n];\nconst YOUNGER = [['Isaac', 'Ishmael'], ['Jacob', 'Esau'], ['Perez', 'Zerah'], ['Joseph', 'his older brothers'], ['Ephraim', 'Manasseh']];\nconst TICKS = [1900, 1800, 1700, 1600, 1500, 1400, 1300].map(y => ({ label: y, left: ((1950 - y) / 650 * 100) + '%', tf: y === 1300 ? 'translateX(-100%)' : 'translateX(-50%)', align: y === 1300 ? 'flex-end' : 'center' }));\nconst NT = {\n  sold: { title: 'Sold by his brothers → Acts 7:9', text: 'Stephen names Joseph first among the rescuers rejected by their own people. The pattern runs through Moses and ends at the cross.', gen: 'g37_28', nt: 'acts7_9' },\n  good: { title: 'Genesis 50:20 → Acts 2:23', text: 'Peter preaches the same shape at Pentecost: people did evil, and God meant it for good, both true at the same time.', gen: 'g50_20', nt: 'acts2_23' },\n  judah: { title: 'Judah’s scepter → Matthew 1', text: 'The promised king comes from Judah, not Joseph. Matthew’s genealogy runs through Judah, Tamar, and Perez.', gen: 'g49_10', nt: 'mt1_2' },\n  visit: { title: '“God will surely visit you” → Luke 1:68', text: 'Genesis ends on a promise. The New Testament opens by keeping it.', gen: 'g50_25', nt: 'lk1_68' }\n};\nconst NT_GEN = [\n  { label: 'Sold by jealous brothers', ref: 'Gen. 37:28', g: 'sold', y: 38 },\n  { label: '“God meant it for good”', ref: 'Gen. 50:20', g: 'good', y: 126 },\n  { label: 'The scepter of Judah', ref: 'Gen. 49:10', g: 'judah', y: 214 },\n  { label: '“God will surely visit you”', ref: 'Gen. 50:25', g: 'visit', y: 302 }\n];\nconst NT_NEW = [\n  { label: 'Acts 2:23', sub: 'Peter at Pentecost', g: 'good', y: 38 },\n  { label: 'Acts 7:9', sub: 'Stephen’s sermon', g: 'sold', y: 126 },\n  { label: 'Luke 1:68', sub: '“He has visited”', g: 'visit', y: 214 },\n  { label: 'Matthew 1:2–3', sub: 'Jesus’ family line', g: 'judah', y: 302 }\n];\nconst DEEP = ['Where is God in a story where he never shows up?', 'Was Joseph a spoiled brat or a hero?', 'Why do Judah and Tamar interrupt the story?', 'Why did Joseph put his brothers through all that?', 'Does Joseph’s story fit real Egypt?', 'Is Joseph a picture of Jesus?', 'Why does Genesis end with a coffin?', 'The takeaway & sources'];\n\nclass Component extends DCLogic {\n  state = { mode: 'quick', ch: 0, tab: 0, arc: 0, step: 0, q: [true, false, false], nt: 'sold', pop: null };\n  componentDidMount() {\n    this._key = e => {\n      if (e.key === 'Escape') this.setState({ pop: null });\n      if (this.state.mode === 'quick' && this.state.tab === 1 && e.key === 'ArrowRight') this.go(1);\n      if (this.state.mode === 'quick' && this.state.tab === 1 && e.key === 'ArrowLeft') this.go(-1);\n    };\n    window.addEventListener('keydown', this._key);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); }\n  go(d) { this.setState(s => ({ step: Math.max(0, Math.min(STEPS.length - 1, s.step + d)) })); }\n  open(kind, key, e) {\n    const vw = window.innerWidth, vh = window.innerHeight;\n    const r = e.currentTarget.getBoundingClientRect();\n    const left = Math.max(12, Math.min(vw - 352, r.left + r.width / 2 - 170));\n    const below = r.bottom < vh * 0.6;\n    this.setState({ pop: { kind, key, left: left + 'px', top: below ? (r.bottom + 10) + 'px' : 'auto', bottom: below ? 'auto' : (vh - r.top + 10) + 'px' } });\n  }\n  setCh(i) { this.setState({ ch: Math.max(0, Math.min(DEEP.length - 1, i)), pop: null }); window.scrollTo(0, 0); }\n  setMode(m) { this.setState({ mode: m, pop: null }); window.scrollTo(0, 0); }\n  setTab(i) { this.setState({ tab: i, pop: null }); window.scrollTo(0, 0); }\n  renderVals() {\n    const s = this.state;\n    const v = {}; Object.keys(VERSES).forEach(k => { v[k] = e => this.open('verse', k, e); });\n    const t = {}; Object.keys(TERMS).forEach(k => { t[k] = e => this.open('term', k, e); });\n    const rd = k => e => this.open('verse', k, e);\n    const places = Object.entries(PLACES).map(([k, p]) => {\n      const [x, y] = proj(LL[k]);\n      return { ...p, x, y, lx: x + p.dx, ly: y + p.dy, go: () => this.setState({ step: STEPS.findIndex(st => st.place === k) }) };\n    });\n    const st = STEPS[s.step];\n    const [ax, ay] = proj(LL[st.place]);\n    const seg = st.leg ? legPath(st.leg) : '';\n    const legKeys = STEPS.slice(0, s.step + 1).map(x => x.leg).filter(Boolean);\n    const kindsShown = [...new Set(legKeys.map(k => LEGS[k].kind))];\n    const arcSel = ARC[s.arc];\n    const pop = s.pop;\n    let popTitle = '', popText = '', popFoot = '', popColor = 'var(--color-accent)';\n    if (pop) {\n      if (pop.kind === 'verse') { [popTitle, popText] = VERSES[pop.key]; popFoot = 'ESV'; }\n      else { [popTitle, popText] = TERMS[pop.key]; popFoot = 'Key term'; popColor = 'var(--color-accent-2)'; }\n    }\n    const toggle = i => () => this.setState(x => { const q = x.q.slice(); q[i] = !q[i]; return { q }; });\n    const sel = g => g === s.nt;\n    const nts = NT[s.nt];\n    return {\n      showTimeline: this.props.showTimeline ?? true,\n      showSources: this.props.showSources ?? true,\n      v, t,\n      tabs: TABS.map((label, i) => ({ label, go: () => this.setTab(i), color: i === s.tab ? 'var(--color-text)' : 'var(--color-neutral-700)', line: i === s.tab ? 'var(--color-accent)' : 'transparent' })),\n      isOverview: s.tab === 0, isJourney: s.tab === 1, isQA: s.tab === 2, isHeads: s.tab === 3, isFun: s.tab === 4, isDots: s.tab === 5, isTerms: s.tab === 6,\n      prevTab: () => s.tab > 0 && this.setTab(s.tab - 1),\n      nextTab: () => s.tab < TABS.length - 1 && this.setTab(s.tab + 1),\n      prevLabel: s.tab > 0 ? '← ' + TABS[s.tab - 1] : '',\n      nextLabel: s.tab < TABS.length - 1 ? TABS[s.tab + 1] + ' →' : '',\n      storyBefore: ['Creation', 'Fall', 'Flood', 'Abraham', 'Isaac', 'Jacob becomes Israel'],\n      storyAfter: ['Exodus', 'Sinai', 'David', 'Exile', 'Jesus', 'New Creation'],\n      arc: ARC.map((a, i) => ({ ...a, go: () => this.setState({ arc: i }), h: i === s.arc ? 16 : 8, bar: i === s.arc ? 'var(--color-accent-700)' : 'var(--color-accent-300)', ink: i === s.arc ? 'var(--color-accent-800)' : 'var(--color-text)' })),\n      arcSel: { ...arcSel, verseRef: VERSES[arcSel.verse][0], read: rd(arcSel.verse) },\n      shownLegs: legKeys.map(k => ({ d: legPath(k), ...KINDS[LEGS[k].kind], op: k === st.leg ? 1 : 0.45 })),\n      legend: kindsShown.map(k => KINDS[k]), hasLegend: kindsShown.length > 0,\n      activeSeg: seg, activeX: ax, activeY: ay,\n      places,\n      mapLabels: places.map(p => ({ name: p.name, sub: p.sub, go: p.go, left: (p.lx / W * 100) + '%', top: (p.ly / H * 100) + '%', tf: p.left ? 'translate(-100%, -75%)' : 'translate(0, -75%)', align: p.left ? 'right' : 'left' })),\n      stepNum: s.step + 1, stepTotal: STEPS.length,\n      stepDots: STEPS.map((x, i) => ({ n: i + 1, name: x.name, go: () => this.setState({ step: i }), bg: i === s.step ? 'var(--color-accent-2)' : (i < s.step ? 'var(--color-accent-2-100)' : 'transparent'), border: i <= s.step ? 'var(--color-accent-2)' : 'var(--color-neutral-400)', ink: i === s.step ? '#fff' : 'var(--color-text)' })),\n      step: { ...st, verseRef: VERSES[st.verse][0], read: rd(st.verse) },\n      prevStep: () => this.go(-1), nextStep: () => this.go(1),\n      q1Open: s.q[0], q2Open: s.q[1], q3Open: s.q[2],\n      q1Sign: s.q[0] ? '–' : '+', q2Sign: s.q[1] ? '–' : '+', q3Sign: s.q[2] ? '–' : '+',\n      toggleQ1: toggle(0), toggleQ2: toggle(1), toggleQ3: toggle(2),\n      judah: JUDAH.map((j, i) => ({ ...j, read: rd(j.verse), bar: i === 3 ? 'var(--color-accent)' : ['var(--color-neutral-300)', 'var(--color-accent-200)', 'var(--color-accent-300)'][i] })),\n      pivots: PIVOTS.map((p, i) => ({ ...p, read: rd(p.verse), line: i === 3 ? 'var(--color-accent)' : 'var(--color-text)' })),\n      bones: BONES.map(b => ({ ...b, read: rd(b.verse) })),\n      younger: YOUNGER.map(([a, b]) => ({ a, b })),\n      ticks: TICKS,\n      ntGen: NT_GEN.map(x => ({ ...x, go: () => this.setState({ nt: x.g }), bg: sel(x.g) ? 'var(--color-accent-100)' : '#fff', border: sel(x.g) ? 'var(--color-accent)' : 'var(--color-neutral-300)' })),\n      ntNew: NT_NEW.map(x => ({ ...x, go: () => this.setState({ nt: x.g }), bg: sel(x.g) ? 'var(--color-accent-100)' : '#fff', border: sel(x.g) ? 'var(--color-accent)' : 'var(--color-neutral-300)' })),\n      ntLines: NT_GEN.map(g => { const n = NT_NEW.find(x => x.g === g.g); return { y1: g.y, y2: n.y, d: `M0,${g.y} C60,${g.y} 60,${n.y} 120,${n.y}`, stroke: sel(g.g) ? 'var(--color-accent)' : 'var(--color-neutral-300)', w: sel(g.g) ? 3 : 1.5 }; }),\n      ntSel: { title: nts.title, text: nts.text, genRef: VERSES[nts.gen][0], genText: VERSES[nts.gen][1], ntRef: VERSES[nts.nt][0], ntText: VERSES[nts.nt][1] },\n      terms: KEY_TERMS.map(k => ({ term: TERMS[k][0], def: TERMS[k][1] })),\n      isQuick: s.mode === 'quick', isDeep: s.mode === 'deep',\n      setDeep: () => this.setMode('deep'),\n      modes: [['quick', 'Teacher Notes', 'Quick summary · 10 min'], ['deep', 'Going Deeper', 'The long read · 7 questions']].map(([k, label, sub]) => ({ label, sub, go: () => this.setMode(k), bg: s.mode === k ? 'var(--color-accent)' : 'transparent', ink: s.mode === k ? '#fff' : 'var(--color-text)' })),\n      ch: Object.fromEntries(DEEP.map((_, i) => ['c' + i, s.ch === i])),\n      deepNav: DEEP.map((title, i) => ({ title, n: i < 7 ? String(i + 1) : '★', go: () => this.setCh(i), bg: s.ch === i ? 'var(--color-accent-100)' : 'transparent', line: s.ch === i ? 'var(--color-accent)' : 'transparent', ink: s.ch === i ? 'var(--color-accent-900)' : 'var(--color-text)' })),\n      deepPrev: () => s.ch > 0 && this.setCh(s.ch - 1),\n      deepNext: () => s.ch < DEEP.length - 1 && this.setCh(s.ch + 1),\n      deepPrevLabel: s.ch > 0 ? '← ' + DEEP[s.ch - 1] : '',\n      deepNextLabel: s.ch < DEEP.length - 1 ? DEEP[s.ch + 1] + ' →' : '',\n      popOpen: !!pop, closePop: () => this.setState({ pop: null }),\n      popLeft: pop ? pop.left : '0', popTop: pop ? pop.top : 'auto', popBottom: pop ? pop.bottom : 'auto',\n      popTitle, popText, popFoot, popColor\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
