document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"bc958658-bd2a-418f-9acf-88ad173ec693\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"aa6f74fc-e49a-406b-9ff4-51557d24c2be\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* hebrew */\n@font-face {\n  font-family: 'Noto Serif Hebrew';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"aee047b1-8aee-4093-8a41-44533f0ae582\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Noto Serif Hebrew';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"114403a6-5542-4593-891b-abd899e39f55\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Noto Serif Hebrew';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"5460e6f8-c357-4e06-bd65-780ccef5f493\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: var(--color-bg); }\n  a { color: var(--color-accent-700); }\n  a:hover { color: var(--color-accent-800); }\n  button { font: inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body);\">\n  <header style=\"max-width:1120px; margin:0 auto; padding:28px 40px 0;\">\n    <div style=\"border-top:4px solid var(--color-text); padding-top:3px;\"><div style=\"border-top:1px solid var(--color-text);\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; padding:10px 0 9px; border-bottom:1px solid var(--color-text);\">\n      <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase;\">Crossings MS Chapel / Teacher Resource<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase;\">October 28<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-top:28px;\">\n      <div>\n        <h1 style=\"font-family:var(--font-heading); font-weight:600; font-size:46px; line-height:1.05; letter-spacing:-0.01em; margin:0;\">Joseph: God’s Hidden Hand<\u002Fh1>\n        <div style=\"margin-top:10px; font-size:13px; letter-spacing:0.06em; color:var(--color-neutral-700);\">Genesis 37–50 · MS Chapel · Mike O’Hara<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px; line-height:1.5; color:var(--color-neutral-700); max-width:34ch;\">Click any <span style=\"color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\">verse reference<\u002Fspan> to read it, and any <span style=\"border-bottom:1.5px dotted var(--color-accent-2);\">underlined term<\u002Fspan> for its meaning.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; margin-top:26px; border:1px solid var(--color-neutral-400); width:max-content; max-width:100%;\">\n      <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ m.go }}\" style=\"appearance:none; border:none; cursor:pointer; padding:10px 20px; text-align:left; background:{{ m.bg }}; color:{{ m.ink }};\">\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:16px;\">{{ m.label }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;\">{{ m.sub }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isDeep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:20px; border-bottom:1px solid var(--color-neutral-300);\"><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ true }}\">\n    <nav style=\"display:flex; gap:4px; flex-wrap:wrap; margin-top:26px; border-bottom:1px solid var(--color-neutral-300);\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ tb.go }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:12px 14px 11px; margin-bottom:-1px; font-family:var(--font-heading); font-size:15px; font-weight:600; color:{{ tb.color }}; border-bottom:3px solid {{ tb.line }};\" style-hover=\"color:var(--color-accent-700);\">{{ tb.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:36px 40px 0;\">\n\n    <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-if value=\"{{ showTimeline }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom:44px;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">The One Story<\u002Fdiv>\n          <div style=\"position:relative; margin-top:32px; display:grid; grid-template-columns:repeat(13, minmax(0,1fr));\">\n            <div style=\"position:absolute; left:3.8%; right:3.8%; top:5px; height:1px; background:var(--color-neutral-400);\"><\u002Fdiv>\n            <sc-for list=\"{{ storyBefore }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n                <div style=\"width:11px; height:11px; border-radius:50%; background:var(--color-neutral-500); box-shadow:0 0 0 3px var(--color-bg);\"><\u002Fdiv>\n                <div style=\"font-size:13px; line-height:1.15; text-align:center; color:var(--color-neutral-700);\">{{ s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n              <div style=\"position:absolute; top:-26px; white-space:nowrap; font-family:var(--font-heading); font-size:10px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-accent-2-700);\">You are here<\u002Fdiv>\n              <div style=\"width:15px; height:15px; margin-top:-2px; border-radius:50%; background:var(--color-accent-2); box-shadow:0 0 0 3px var(--color-bg), 0 0 0 4px var(--color-accent-2);\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-weight:600; font-size:13px; line-height:1.15; text-align:center; color:var(--color-accent-2-800);\">Joseph<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ storyAfter }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n                <div style=\"width:11px; height:11px; border-radius:50%; background:var(--color-bg); border:1.5px solid var(--color-neutral-500); box-sizing:border-box; box-shadow:0 0 0 3px var(--color-bg);\"><\u002Fdiv>\n                <div style=\"font-size:13px; line-height:1.15; text-align:center; color:var(--color-neutral-700);\">{{ s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:56px; align-items:start;\">\n        <section>\n          <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">01 · Where We Are<\u002Fdiv>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\">Jacob is Israel now, with twelve sons and he too has an obvious favorite. Genesis 37–50 is how God’s family ends up in Egypt, which is exactly what God told Abraham would happen back in <span sc-camel-on-click=\"{{ v.g15_13 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Genesis 15<\u002Fspan>. Over about thirteen years, seventeen-year-old Joseph goes down into a pit and a prison cell, and comes up second in command of Egypt.<\u002Fp>\n          <p style=\"font-family:var(--font-heading); font-weight:600; font-size:23px; line-height:1.35; margin:28px 0 0; color:var(--color-accent-800);\">“You meant evil against me, but God meant it for good” (50:20).<\u002Fp>\n        <\u002Fsection>\n        <section>\n          <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">02 · Big Idea<\u002Fdiv>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\"><strong>God never shows up and talks to Joseph, and yet he’s working in every chapter anyway.<\u002Fstrong> Abraham received the Lord speaking to him through visions and a covenant ceremony. Jacob had a dream of a ladder reaching to heaven and a wrestling match with a mystery figure that renamed him Israel.<\u002Fp>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\">Joseph simply gets a stranger on the road pointing him in the right direction, and a caravan of human traffickers right on time. Later a servant and fellow cellmate forgets about him for two years, and then suddenly remembers. Yet all along, that’s God’s hidden hand in his story. Joseph says it himself at the end: “You meant evil against me, but God meant it for good” (<span sc-camel-on-click=\"{{ v.g50_20 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 50:20<\u002Fspan>).<\u002Fp>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\">The Hebrew words in 50:20 are <em><span sc-camel-on-click=\"{{ t.raah }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">ra’ah<\u002Fspan><\u002Fem> (evil) and <em><span sc-camel-on-click=\"{{ t.tovah }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">tovah<\u002Fspan><\u002Fem> (good), the same pair Genesis has been tracking since the garden. Sin brought evil into God’s good world. Yet God keeps turning it back toward good.<\u002Fp>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\">Obviously, Genesis 50:20 doesn’t make the brothers innocent. They chose to sell their brother, and God never needed their sin to get his plan done. God simply outmaneuvered it.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <section style=\"margin-top:56px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">Genesis 37–50 at a glance<\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--color-neutral-700);\">Click a chapter<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr 2.2fr 1fr 1fr 1fr; gap:4px; margin-top:14px;\">\n          <sc-for list=\"{{ arc }}\" as=\"a\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ a.go }}\" style=\"appearance:none; border:none; background:transparent; padding:0; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:7px; min-width:0;\" style-hover=\"opacity:0.8;\">\n              <div style=\"height:{{ a.h }}px; background:{{ a.bar }}; transition:height .15s;\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-weight:600; font-size:14px; line-height:1.2; color:{{ a.ink }};\">{{ a.label }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700);\">{{ a.ref }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px; display:grid; grid-template-columns:200px minmax(0,1fr); gap:28px; padding:22px 26px; background:var(--color-accent-100); border-top:2px solid var(--color-accent);\">\n          <div>\n            <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent-800);\">{{ arcSel.ref }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.15; margin-top:6px; color:var(--color-accent-900);\">{{ arcSel.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-size:17px; line-height:1.6; margin:0; color:var(--color-accent-900);\">{{ arcSel.note }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ arcSel.read }}\" style=\"appearance:none; border:none; background:transparent; padding:0; margin-top:12px; cursor:pointer; font-size:15px; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"color:var(--color-accent-900);\">Read {{ arcSel.verseRef }} →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; line-height:1.5; margin:10px 0 0; color:var(--color-neutral-700);\">Genesis 38 (Judah and Tamar) sits between chapters 37 and 39. Chapel will skip it; see Heads Up.<\u002Fp>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isJourney }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:40px; align-items:start;\">\n        <figure style=\"margin:0;\">\n          <div style=\"position:relative; width:100%; aspect-ratio:760 / 505; border:1px solid var(--color-neutral-300); background:#fbfaf9;\">\n            <img src=\"49526a50-721c-4ead-aeee-ebbec26594cb\" alt=\"Map of Canaan and Egypt\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\">\n            <svg sc-camel-view-box=\"0 0 760 505\" style=\"position:absolute; inset:0; width:100%; height:100%; overflow:visible;\">\n              <sc-for list=\"{{ shownLegs }}\" as=\"lg\" hint-placeholder-count=\"0\">\n                <path d=\"{{ lg.d }}\" fill=\"none\" stroke=\"{{ lg.stroke }}\" stroke-width=\"{{ lg.w }}\" stroke-dasharray=\"{{ lg.dash }}\" opacity=\"{{ lg.op }}\"><\u002Fpath>\n              <\u002Fsc-for>\n              <path d=\"{{ activeSeg }}\" fill=\"none\" stroke=\"var(--color-accent-2)\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n              <circle cx=\"{{ activeX }}\" cy=\"{{ activeY }}\" r=\"14\" fill=\"none\" stroke=\"var(--color-accent-2)\" stroke-width=\"2.5\"><\u002Fcircle>\n              <sc-for list=\"{{ places }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <g sc-camel-on-click=\"{{ p.go }}\" style=\"cursor:pointer;\">\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"16\" fill=\"transparent\"><\u002Fcircle>\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"6\" fill=\"var(--color-text)\" stroke=\"#fff\" stroke-width=\"1.6\"><\u002Fcircle>\n                <\u002Fg>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <sc-for list=\"{{ mapLabels }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ m.go }}\" style=\"position:absolute; left:{{ m.left }}; top:{{ m.top }}; transform:{{ m.tf }}; text-align:{{ m.align }}; cursor:pointer; white-space:nowrap; line-height:1.15; text-shadow:0 0 3px #fbfaf9, 0 0 3px #fbfaf9, 0 0 3px #fbfaf9;\">\n                <div style=\"font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-text);\">{{ m.name }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-700);\">{{ m.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ hasLegend }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute; left:12px; top:13%; display:flex; flex-direction:column; gap:6px; padding:10px 12px; background:rgba(255,255,255,0.92); font-size:13px;\">\n              <sc-for list=\"{{ legend }}\" as=\"k\" hint-placeholder-count=\"0\"><div style=\"display:flex; align-items:center; gap:10px;\"><svg width=\"30\" height=\"6\" style=\"display:block;\"><line x1=\"0\" y1=\"3\" x2=\"30\" y2=\"3\" stroke=\"{{ k.stroke }}\" stroke-width=\"{{ k.w }}\" stroke-dasharray=\"{{ k.dash }}\"><\u002Fline><\u002Fsvg>{{ k.label }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <figcaption style=\"font-size:13px; line-height:1.5; margin-top:10px; color:var(--color-neutral-700);\">Joseph goes looking for his brothers at Shechem and finds them at Dothan. Traders carry him to Egypt. Years later the whole family follows by way of Beersheba and settles in Goshen. Sites and routes approximate. Map data: Natural Earth.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <aside style=\"position:sticky; top:20px;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">Stop {{ stepNum }} of {{ stepTotal }}<\u002Fdiv>\n          <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;\">\n            <sc-for list=\"{{ stepDots }}\" as=\"d\" hint-placeholder-count=\"9\">\n              <button sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.name }}\" style=\"appearance:none; cursor:pointer; width:30px; height:30px; border-radius:50%; border:1.5px solid {{ d.border }}; background:{{ d.bg }}; color:{{ d.ink }}; font-family:var(--font-heading); font-size:13px; font-weight:600; padding:0;\">{{ d.n }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <h2 style=\"font-family:var(--font-heading); font-weight:600; font-size:32px; line-height:1.1; margin:22px 0 0;\">{{ step.name }}<\u002Fh2>\n          <div style=\"font-size:14px; margin-top:6px; color:var(--color-neutral-700);\">{{ step.when }}<\u002Fdiv>\n          <p style=\"font-size:17px; line-height:1.62; margin:16px 0 0; text-wrap:pretty;\">{{ step.note }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ step.read }}\" style=\"appearance:none; border:none; background:transparent; padding:0; margin-top:14px; cursor:pointer; font-size:15px; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"color:var(--color-accent-900);\">Read {{ step.verseRef }} →<\u002Fbutton>\n          <div style=\"display:flex; gap:10px; margin-top:28px;\">\n            <button sc-camel-on-click=\"{{ prevStep }}\" style=\"appearance:none; cursor:pointer; padding:10px 16px; border:1px solid var(--color-neutral-400); background:transparent; border-radius:var(--radius-sm, 2px); font-family:var(--font-heading); font-size:14px; font-weight:600; color:var(--color-text);\" style-hover=\"background:var(--color-accent-100); border-color:var(--color-accent);\">← Previous<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ nextStep }}\" style=\"appearance:none; cursor:pointer; padding:10px 16px; border:1px solid var(--color-accent); background:var(--color-accent); border-radius:var(--radius-sm, 2px); font-family:var(--font-heading); font-size:14px; font-weight:600; color:#fff;\" style-hover=\"background:var(--color-accent-600);\">Next stop →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isQA }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">03 · If A Student Asks<\u002Fdiv>\n      <div style=\"max-width:820px; margin-top:16px; border-top:1.5px solid var(--color-text);\">\n\n        <div style=\"border-bottom:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ toggleQ1 }}\" style=\"appearance:none; border:none; background:transparent; width:100%; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) 32px; gap:12px; align-items:center; padding:20px 0; text-align:left;\" style-hover=\"background:var(--color-accent-100);\">\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; color:var(--color-accent); padding-left:6px;\">Q<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; line-height:1.3; color:var(--color-text);\">“So did God make the brothers sell Joseph?”<\u002Fspan>\n            <span style=\"font-size:24px; color:var(--color-accent-700);\">{{ q1Sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ q1Open }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:0 44px 26px 52px;\">\n              <p style=\"font-size:17px; line-height:1.65; margin:0; text-wrap:pretty;\">No. They wanted him dead and chose to sell him instead. The text holds them fully responsible, and so does Joseph. God didn’t cause their sin. He used it, and he could have gotten his plan done without it.<\u002Fp>\n              <div style=\"margin:18px 0 0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px;\">\n                <div style=\"padding:14px 16px; background:var(--color-neutral-100); border-top:2px solid var(--color-text);\">\n                  <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-neutral-800);\">What the brothers meant<\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.45; margin-top:6px;\">Evil (<em><span sc-camel-on-click=\"{{ t.raah }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">ra’ah<\u002Fspan><\u002Fem>). Their choice, their guilt.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 16px; background:var(--color-accent-100); border-top:2px solid var(--color-accent);\">\n                  <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent-800);\">What God meant<\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.45; margin-top:6px; color:var(--color-accent-900);\">Good (<em><span sc-camel-on-click=\"{{ t.tovah }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">tovah<\u002Fspan><\u002Fem>): “many people should be kept alive.”<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; margin:8px 0 0; color:var(--color-neutral-700);\">Both halves of one sentence, <span sc-camel-on-click=\"{{ v.g50_20 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Genesis 50:20<\u002Fspan>.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ toggleQ2 }}\" style=\"appearance:none; border:none; background:transparent; width:100%; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) 32px; gap:12px; align-items:center; padding:20px 0; text-align:left;\" style-hover=\"background:var(--color-accent-100);\">\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; color:var(--color-accent); padding-left:6px;\">Q<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; line-height:1.3; color:var(--color-text);\">“Why didn’t Joseph just tell them who he was?”<\u002Fspan>\n            <span style=\"font-size:24px; color:var(--color-accent-700);\">{{ q2Sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ q2Open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 44px 26px 52px;\">\n              <p style=\"font-size:17px; line-height:1.65; margin:0; text-wrap:pretty;\">He was testing whether they’d changed. He set things up so they could abandon a brother again: Benjamin got the bigger portion at dinner, the way Joseph once got the robe, and then the silver cup gave them a clean excuse to leave Benjamin behind. This time Judah refused and offered himself instead, showing he had changed (<span sc-camel-on-click=\"{{ v.g44_33 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 44:33<\u002Fspan>).<\u002Fp>\n              <div style=\"margin:20px 0 0; border-top:1.5px solid var(--color-text); border-bottom:1.5px solid var(--color-text);\">\n                <div style=\"display:grid; grid-template-columns:130px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:9px 0; border-bottom:1px solid var(--color-neutral-300); font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-neutral-700);\"><div><\u002Fdiv><div>Then · Dothan<\u002Fdiv><div>Now · Egypt<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:130px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); font-size:16px;\"><div style=\"font-weight:600;\">The favorite<\u002Fdiv><div>Joseph gets the robe (<span sc-camel-on-click=\"{{ v.g37_3 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">37:3<\u002Fspan>)<\u002Fdiv><div>Benjamin gets five times the food during a famine. (<span class=\"scp1\" style=\"cursor: pointer; color: var(--color-accent-700); border-bottom: 1px dotted var(--color-accent);\">43:34<\u002Fspan>)<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:130px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); font-size:16px;\"><div style=\"font-weight:600;\">The easy out<\u002Fdiv><div>A caravan passing by<\u002Fdiv><div>A silver cup in Benjamin’s sack<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:130px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:11px 0; font-size:16px;\"><div style=\"font-weight:600;\">Judah says<\u002Fdiv><div>“Let us sell him” (<span sc-camel-on-click=\"{{ v.g37_26 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">37:27<\u002Fspan>)<\u002Fdiv><div style=\"color:var(--color-accent-800); font-weight:600;\">“Take me instead” (<span sc-camel-on-click=\"{{ v.g44_33 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">44:33<\u002Fspan>)<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; margin:8px 0 0; color:var(--color-neutral-700);\">Same setup, different answer.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ toggleQ3 }}\" style=\"appearance:none; border:none; background:transparent; width:100%; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) 32px; gap:12px; align-items:center; padding:20px 0; text-align:left;\" style-hover=\"background:var(--color-accent-100);\">\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; color:var(--color-accent); padding-left:6px;\">Q<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; line-height:1.3; color:var(--color-text);\">“Is Joseph supposed to be Jesus?”<\u002Fspan>\n            <span style=\"font-size:24px; color:var(--color-accent-700);\">{{ q3Sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ q3Open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 44px 26px 52px;\">\n              <p style=\"font-size:17px; line-height:1.65; margin:0; text-wrap:pretty;\">The parallels are real. His brothers reject him and sell him for silver, and he ends up saving the very people who betrayed him. But the New Testament never calls Joseph a picture of Jesus, and the family line that leads to Jesus runs through Judah, not Joseph (<span sc-camel-on-click=\"{{ v.g49_10 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 49:10<\u002Fspan>; <span sc-camel-on-click=\"{{ v.mt1_2 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Matt 1:2–3<\u002Fspan>).<\u002Fp>\n              <div style=\"margin:18px 0 0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px;\">\n                <div style=\"padding:14px 16px; background:var(--color-accent-100); border-top:2px solid var(--color-accent);\">\n                  <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent-800);\">Like Jesus<\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.45; margin-top:6px; color:var(--color-accent-900);\">Rejected, sold for silver, saves the people who betrayed him<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 16px; background:var(--color-neutral-100); border-top:2px solid var(--color-text);\">\n                  <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-neutral-800);\">But<\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.45; margin-top:6px;\">The NT never calls him a picture of Jesus, and Jesus comes from Judah<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; margin:8px 0 0; color:var(--color-neutral-700);\">A pattern, not a prediction. See Going Deeper, section 6.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHeads }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">04 · Heads Up<\u002Fdiv>\n      <div style=\"max-width:760px; margin-top:16px; padding:6px 0 6px 24px; border-left:3px solid var(--color-text); display:flex; flex-direction:column; gap:18px;\">\n        <p style=\"font-size:18px; line-height:1.65; margin:0; text-wrap:pretty;\"><strong>Two adult stories sit inside this one.<\u002Fstrong> Chapel skips Genesis 38 (Judah and Tamar) and keeps Potiphar’s wife vague (“his boss’s wife lied about him”). If a student asks about chapter 38, a fair one-line answer: Judah treated his widowed daughter-in-law unfairly, she exposed it, and Judah admitted, “She is more righteous than I” (<span sc-camel-on-click=\"{{ v.g38_26 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">38:26<\u002Fspan>). It’s where Judah starts to change, which is the only major detail you need at this point.<\u002Fp>\n        <p style=\"font-size:18px; line-height:1.65; margin:0; text-wrap:pretty;\"><strong>Don’t hand 50:20 to a hurting student as “God planned this for you.”<\u002Fstrong> Joseph said it about his own story, looking back, after years of suffering. Nobody said it to him while he was in the pit or forgotten about in prison.<\u002Fp>\n        <p style=\"font-size:18px; line-height:1.65; margin:0; text-wrap:pretty;\"><strong>Favoritism and sibling conflict will hit close to home<\u002Fstrong> for some students.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFun }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">05 · Fun Fact<\u002Fdiv>\n      <p style=\"font-size:20px; line-height:1.6; margin:16px 0 0; max-width:60ch; text-wrap:pretty;\">Joseph’s story starts and ends in the same town. Jacob sends him to look for his brothers at Shechem (<span sc-camel-on-click=\"{{ v.g37_12 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 37:12–14<\u002Fspan>). Centuries later, Israel carries Joseph’s bones out of Egypt and buries them at Shechem (<span sc-camel-on-click=\"{{ v.josh24_32 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Josh 24:32<\u002Fspan>).<\u002Fp>\n      <div style=\"max-width:900px; margin-top:36px;\">\n        <div style=\"display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto; align-items:center; gap:0;\">\n          <div style=\"width:22px; height:22px; border-radius:50%; background:var(--color-accent-2);\"><\u002Fdiv>\n          <div style=\"height:2px; background:var(--color-text);\"><\u002Fdiv>\n          <div style=\"width:14px; height:14px; border-radius:50%; background:var(--color-bg); border:2px solid var(--color-text); box-sizing:border-box;\"><\u002Fdiv>\n          <div style=\"height:0; border-top:2px dashed var(--color-neutral-500);\"><\u002Fdiv>\n          <div style=\"width:22px; height:22px; border-radius:50%; background:var(--color-accent-2);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); margin-top:14px;\">\n          <div>\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:24px;\">Shechem<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.45; margin-top:4px;\">A boy sent to find his brothers<\u002Fdiv>\n            <div style=\"font-size:13px; margin-top:4px;\"><span sc-camel-on-click=\"{{ v.g37_12 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Genesis 37:12–14<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:24px;\">Egypt<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.45; margin-top:4px;\">A coffin waiting for a promise<\u002Fdiv>\n            <div style=\"font-size:13px; margin-top:4px;\"><span sc-camel-on-click=\"{{ v.g50_25 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Genesis 50:25–26<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;\">\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:24px;\">Shechem<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.45; margin-top:4px;\">His bones, buried at last<\u002Fdiv>\n            <div style=\"font-size:13px; margin-top:4px;\"><span sc-camel-on-click=\"{{ v.josh24_32 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Joshua 24:32<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDots }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">06 · Connecting the Dots<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:4px; margin-top:18px;\">\n        <div style=\"padding:20px 22px 24px; background:#fff; border-top:2px solid var(--color-text);\">\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:21px;\">The pile-on.<\u002Fdiv>\n          <p style=\"font-size:17px; line-height:1.6; margin:10px 0 0; text-wrap:pretty;\">“Come now, let us kill him” (<span sc-camel-on-click=\"{{ v.g37_20 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Gen 37:20<\u002Fspan>) has no single leader. Nobody starts it. The group just turns. Students know this from every group chat that turned on someone.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:20px 22px 24px; background:#fff; border-top:2px solid var(--color-text);\">\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:21px;\">Faithful when nobody’s watching.<\u002Fdiv>\n          <p style=\"font-size:17px; line-height:1.6; margin:10px 0 0; text-wrap:pretty;\">“The LORD was with Joseph” shows up in Potiphar’s house and in the prison (Gen <span sc-camel-on-click=\"{{ v.g39_2 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">39:2<\u002Fspan>, <span sc-camel-on-click=\"{{ v.g39_21 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">21<\u002Fspan>), years before the palace. God doesn’t wait for the comeback to show up.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:20px 22px 24px; background:var(--color-accent-100); border-top:2px solid var(--color-accent);\">\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; color:var(--color-accent-900);\">People can change.<\u002Fdiv>\n          <p style=\"font-size:17px; line-height:1.6; margin:10px 0 0; color:var(--color-accent-900); text-wrap:pretty;\">Judah went from “let’s sell him” to “take me instead.” For a student convinced they’re stuck being the person they were last year, Judah is the proof.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <section style=\"margin-top:48px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">Judah, chapter by chapter<\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--color-neutral-700);\">Click a reference to read it<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); margin-top:16px; border-top:1.5px solid var(--color-text);\">\n          <sc-for list=\"{{ judah }}\" as=\"j\" hint-placeholder-count=\"4\">\n            <div style=\"padding:16px 18px 18px 0; display:flex; flex-direction:column; gap:6px;\">\n              <div style=\"height:6px; background:{{ j.bar }};\"><\u002Fdiv>\n              <span sc-camel-on-click=\"{{ j.read }}\" style=\"cursor:pointer; align-self:flex-start; font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent); margin-top:6px;\" style-hover=\"background:var(--color-accent-100);\">{{ j.ref }}<\u002Fspan>\n              <div style=\"font-family:var(--font-heading); font-weight:600; font-size:19px; line-height:1.25;\">{{ j.quote }}<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.45; color:var(--color-neutral-800);\">{{ j.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTerms }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">07 · Key Terms<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:56px; margin-top:16px; align-items:start;\">\n        <div style=\"border-top:1.5px solid var(--color-text);\">\n          <sc-for list=\"{{ terms }}\" as=\"tm\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:16px; padding:14px 0; border-bottom:1px so
