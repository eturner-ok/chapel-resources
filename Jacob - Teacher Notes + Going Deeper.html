o Herod’s massacre in Bethlehem (<span sc-camel-on-click=\"{{ v.m2_18 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Matt. 2:18<\u002Fspan>).<\u002Fp><p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">Finally, Isaac dies at 180, and “his sons Esau and Jacob buried him” (<span sc-camel-on-click=\"{{ v.g35_29 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">35:29<\u002Fspan>), the brothers standing at the same grave, just as Isaac and Ishmael did for Abraham.<\u002Fp><figure style=\"margin:40px 0 8px;\"><div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:14px;\">Two graves, two pairs of brothers<\u002Fdiv><div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px;\"><div style=\"padding:18px; background:#fff; border-top:2px solid var(--color-text); text-align:center;\"><div style=\"font-size:13px;\"><span sc-camel-on-click=\"{{ v.g25_9 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Genesis 25:9<\u002Fspan><\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:20px; margin-top:6px;\">Abraham’s grave<\u002Fdiv><div style=\"font-size:18px; margin-top:6px; color:var(--color-accent-800);\">Isaac + Ishmael<\u002Fdiv><\u002Fdiv><div style=\"padding:18px; background:#fff; border-top:2px solid var(--color-text); text-align:center;\"><div style=\"font-size:13px;\"><span sc-camel-on-click=\"{{ v.g35_29 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Genesis 35:29<\u002Fspan><\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:20px; margin-top:6px;\">Isaac’s grave<\u002Fdiv><div style=\"font-size:18px; margin-top:6px; color:var(--color-accent-800);\">Esau + Jacob<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure><h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">Esau’s kings come first<\u002Fh3><p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">Genesis 36 is a genealogy most readers skip, but it holds a quiet irony. Esau moves away from Jacob because their herds were too large for the land to hold them both (36:6–8), and his line produces chiefs and kings. The text notes these kings reigned in Edom “before any king reigned over the Israelites” (<span sc-camel-on-click=\"{{ v.g36_31 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">36:31<\u002Fspan>). Edom had kings long before Israel did. God’s promise to Jacob included kings (<span sc-camel-on-click=\"{{ v.g35_11 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">35:11<\u002Fspan>), and it would take centuries. Being chosen didn’t mean being first.<\u002Fp><h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">Covenant thread<\u002Fh3><p style=\"font-size:18px; line-height:1.68; margin:16px 0 0; text-wrap:pretty;\">The promise to Abraham passes hand to hand in these chapters: to Isaac (26:3–5), to Jacob at Bethel (<span sc-camel-on-click=\"{{ v.g28_15 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">28:13–15<\u002Fspan>), and to Jacob again at Bethel (35:11–12). It’s one covenant, reaffirmed, not a new one each time, which is why Scripture later speaks of God remembering “his covenant with Abraham, with Isaac, and with Jacob” (<span sc-camel-on-click=\"{{ v.ex2_24 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Ex. 2:24<\u002Fspan>). The heir’s new name becomes the nation’s name, and the stairway Jacob saw at Bethel lands on Jesus (<span sc-camel-on-click=\"{{ v.j1_51 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">John 1:51<\u002Fspan>).<\u002Fp><figure style=\"margin:40px 0 8px;\"><div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:14px;\">One promise, hand to hand<\u002Fdiv><div style=\"display:flex; flex-direction:column; align-items:flex-start;\"><div style=\"display:grid; grid-template-columns:40px 170px minmax(0,1fr); align-items:center; gap:12px;\"><div style=\"width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:1.5px solid var(--color-accent); color:var(--color-accent-800); font-family:var(--font-heading); font-weight:600;\">1<\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">Abraham<\u002Fdiv><div style=\"font-size:15.5px; color:var(--color-neutral-800);\">Land, descendants, blessing to the world<\u002Fdiv><\u002Fdiv><div style=\"width:1px; height:18px; margin-left:20px; background:var(--color-accent);\"><\u002Fdiv><div style=\"display:grid; grid-template-columns:40px 170px minmax(0,1fr); align-items:center; gap:12px;\"><div style=\"width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:1.5px solid var(--color-accent); color:var(--color-accent-800); font-family:var(--font-heading); font-weight:600;\">2<\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">Isaac<\u002Fdiv><div style=\"font-size:15.5px; color:var(--color-neutral-800);\">26:3–5<\u002Fdiv><\u002Fdiv><div style=\"width:1px; height:18px; margin-left:20px; background:var(--color-accent);\"><\u002Fdiv><div style=\"display:grid; grid-template-columns:40px 170px minmax(0,1fr); align-items:center; gap:12px;\"><div style=\"width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:1.5px solid var(--color-accent); color:var(--color-accent-800); font-family:var(--font-heading); font-weight:600;\">3<\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">Jacob at Bethel<\u002Fdiv><div style=\"font-size:15.5px; color:var(--color-neutral-800);\"><span sc-camel-on-click=\"{{ v.g28_15 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">28:13–15<\u002Fspan> · the stairway<\u002Fdiv><\u002Fdiv><div style=\"width:1px; height:18px; margin-left:20px; background:var(--color-accent);\"><\u002Fdiv><div style=\"display:grid; grid-template-columns:40px 170px minmax(0,1fr); align-items:center; gap:12px;\"><div style=\"width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:1.5px solid var(--color-accent); color:var(--color-accent-800); font-family:var(--font-heading); font-weight:600;\">4<\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">Israel at Bethel<\u002Fdiv><div style=\"font-size:15.5px; color:var(--color-neutral-800);\"><span sc-camel-on-click=\"{{ v.g35_11 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">35:11–12<\u002Fspan> · nations and kings<\u002Fdiv><\u002Fdiv><div style=\"width:1px; height:18px; margin-left:20px; background:var(--color-accent);\"><\u002Fdiv><div style=\"display:grid; grid-template-columns:40px 170px minmax(0,1fr); align-items:center; gap:12px;\"><div style=\"width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--color-accent); border:1.5px solid var(--color-accent); color:#fff; font-family:var(--font-heading); font-weight:600;\">5<\u002Fdiv><div style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">Jesus<\u002Fdiv><div style=\"font-size:15.5px; color:var(--color-neutral-800);\">The stairway lands on him (<span sc-camel-on-click=\"{{ v.j1_51 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">John 1:51<\u002Fspan>)<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<\u002Fsc-if>\n<sc-if value=\"{{ ch.c9 }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--color-neutral-700);\">The takeaway<\u002Fdiv><p style=\"font-family:var(--font-heading); font-weight:600; font-size:36px; line-height:1.2; margin:16px 0 0; max-width:22em; text-wrap:balance;\">God’s promise never depended on Jacob being trustworthy. <span style=\"color:var(--color-accent-700);\">It depended on God being trustworthy to his promise.<\u002Fspan><\u002Fp><h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">For further study<\u002Fh3><div style=\"display:flex; flex-direction:column; gap:12px; margin:18px 0 0;\"><div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\">GotQuestions, “Why did God love Jacob and hate Esau?” <a href=\"https://www.gotquestions.org/Jacob-Esau-love-hate.html\" target=\"_blank\">gotquestions.org/Jacob-Esau-love-hate.html<\u002Fa><\u002Fspan><\u002Fdiv><div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\">BibleProject, Genesis 12–50 overview video, <a href=\"https://bibleproject.com/explore/video/genesis-12-50/\" target=\"_blank\">bibleproject.com/explore/video/genesis-12-50/<\u002Fa><\u002Fspan><\u002Fdiv><div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); font-size:18px; line-height:1.62;\"><span style=\"color:var(--color-accent);\">•<\u002Fspan><span style=\"text-wrap:pretty;\">BibleProject podcast, “Genesis: Why Can’t Jacob and Esau Both Be Blessed?” (Genesis Q+R)<\u002Fspan><\u002Fdiv><\u002Fdiv><h3 style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.25; margin:44px 0 0;\">Sources referenced above<\u002Fh3><div style=\"display:flex; flex-direction:column; gap:8px; margin-top:14px; font-size:15px; line-height:1.5; color:var(--color-neutral-800);\"><p style=\"margin:0;\">Joyce G. Baldwin, The Message of Genesis 12–50, The Bible Speaks Today (Downers Grove: InterVarsity Press, 1986).<\u002Fp><p style=\"margin:0;\">D. A. Carson et al., eds., New Bible Commentary: 21st Century Edition, 4th ed. (Downers Grove: InterVarsity Press, 1994).<\u002Fp><p style=\"margin:0;\">John Calvin, Commentary on Genesis, vol. 2, on Genesis 34:1 (public domain; Christian Classics Ethereal Library).<\u002Fp><p style=\"margin:0;\">Dale Ralph Davis, God’s Rascal: The Jacob Narrative in Genesis 25–35. [Publisher and year to confirm.]<\u002Fp><p style=\"margin:0;\">Tony Evans, The Tony Evans Bible Commentary.<\u002Fp><p style=\"margin:0;\">Peter J. Gentry and Stephen J. Wellum, God’s Kingdom through God’s Covenants: A Concise Biblical Theology.<\u002Fp><p style=\"margin:0;\">K. A. Mathews, Genesis 11:27–50:26, New American Commentary (Nashville: B&amp;H, 2005).<\u002Fp><p style=\"margin:0;\">Jeffrey J. Niehaus, Biblical Theology, Volume 2: The Special Grace Covenants (Old Testament).<\u002Fp><p style=\"margin:0;\">Allen P. Ross, Genesis, Cornerstone Biblical Commentary.<\u002Fp><p style=\"margin:0;\">John F. Walvoord and Roy B. Zuck, eds., The Bible Knowledge Commentary (Wheaton: Victor Books, 1985).<\u002Fp><p style=\"margin:0;\">John H. Walton, Genesis, NIV Application Commentary (Grand Rapids: Zondervan, 2001).<\u002Fp><p style=\"margin:0;\">GotQuestions.org: “Why did God love Jacob and hate Esau?”; “What is the difference between a blessing and a birthright?”; “Why was a father’s blessing so highly valued?”; “Did Jacob placing branches in front of his flock really result in speckled offspring?”; “Who were the Edomites?”; “Who was Herod the Great?”<\u002Fp><p style=\"margin:0;\">BibleProject: “Genesis 12–50” (video); “Genesis: Wrestling God for a Blessing” and “Firstborn” (podcast).<\u002Fp><p style=\"margin:0;\">Ligonier Ministries, on Romans 9 and Jacob and Esau.<\u002Fp><p style=\"margin:0;\">BibleRef.com, on “hate” as comparison language (Luke 14:26).<\u002Fp><\u002Fdiv>\n<\u002Fsc-if>\n        <div style=\"display:flex; justify-content:space-between; gap:12px; margin-top:56px; padding-top:18px; border-top:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ deepPrev }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:8px 0; text-align:left; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700); max-width:45%;\" style-hover=\"color:var(--color-accent-900);\">{{ deepPrevLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deepNext }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:8px 0; text-align:right; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700); max-width:45%;\" style-hover=\"color:var(--color-accent-900);\">{{ deepNextLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <footer style=\"max-width:1120px; margin:0 auto; padding:0 40px 48px;\">\n    <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; padding-top:20px; border-top:1.5px solid var(--color-text);\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-accent-2-700);\">Coming Up Next<\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.6; margin:8px 0 0;\">Joseph (Genesis 37–50). Jacob plays favorites with Rachel’s son, and the family pays for it.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-accent-700);\">Go Deeper<\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.6; margin:8px 0 0;\">The years between Moriah and Jacob, why a blessing mattered so much, “Esau I hated” in full, Laban’s house, the brothers’ feud all the way to Herod, and Genesis 34.<\u002Fp>\n        <button sc-camel-on-click=\"{{ setDeep }}\" style=\"appearance:none; border:none; background:transparent; padding:0; margin-top:10px; cursor:pointer; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700); border-bottom:1px solid var(--color-accent);\" style-hover=\"color:var(--color-accent-900);\">Open Going Deeper →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <p style=\"font-size:12px; line-height:1.5; margin:28px 0 0; color:var(--color-neutral-700);\">Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.<\u002Fp>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ popOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closePop }}\" style=\"position:fixed; inset:0; z-index:40;\"><\u002Fdiv>\n    <div style=\"position:fixed; z-index:41; left:{{ popLeft }}; top:{{ popTop }}; bottom:{{ popBottom }}; width:340px; padding:18px 20px 16px; background:#fff; border-top:3px solid {{ popColor }}; box-shadow:var(--shadow-lg);\">\n      <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px;\">\n        <div style=\"font-family:var(--font-heading); font-weight:600; font-size:19px;\">{{ popTitle }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closePop }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; font-size:20px; line-height:1; color:var(--color-neutral-700); padding:0;\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:16px; line-height:1.55; margin:10px 0 0;\">{{ popText }}<\u002Fp>\n      <div style=\"font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-top:10px; color:var(--color-neutral-600);\">{{ popFoot }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTimeline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst VERSES = {\n  g28_15: ['Genesis 28:15', 'Behold, I am with you and will keep you wherever you go, and will bring you back to this land. For I will not leave you until I have done what I have promised you.'],\n  ex3_6: ['Exodus 3:6', 'And he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, for he was afraid to look at God.'],\n  mal1_2: ['Malachi 1:2–3', '“I have loved you,” says the LORD. But you say, “How have you loved us?” “Is not Esau Jacob’s brother?” declares the LORD. “Yet I have loved Jacob but Esau I have hated. I have laid waste his hill country and left his heritage to jackals of the desert.”'],\n  rom9_13: ['Romans 9:13', 'As it is written, “Jacob I loved, but Esau I hated.”'],\n  g29_30: ['Genesis 29:30–31', 'So Jacob went in to Rachel also, and he loved Rachel more than Leah, and served Laban for another seven years. When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.'],\n  dt23_7: ['Deuteronomy 23:7', 'You shall not abhor an Edomite, for he is your brother. You shall not abhor an Egyptian, because you were a sojourner in his land.'],\n  g25_23: ['Genesis 25:23', 'And the LORD said to her, “Two nations are in your womb, and two peoples from within you shall be divided; the one shall be stronger than the other, the older shall serve the younger.”'],\n  g27_1: ['Genesis 27:1–4', 'When Isaac was old and his eyes were dim so that he could not see, he called Esau his older son and said to him, “My son”; and he answered, “Here I am.” He said, “Behold, I am old; I do not know the day of my death. Now then, take your weapons, your quiver and your bow, and go out to the field and hunt game for me, and prepare for me delicious food, such as I love, and bring it to me so that I may eat, that my soul may bless you before I die.”'],\n  g32_25: ['Genesis 32:25', 'When the man saw that he did not prevail against Jacob, he touched his hip socket, and Jacob’s hip was put out of joint as he wrestled with him.'],\n  g32_30: ['Genesis 32:30', 'So Jacob called the name of the place Peniel, saying, “For I have seen God face to face, and yet my life has been delivered.”'],\n  hos12_4: ['Hosea 12:4', 'He strove with the angel and prevailed; he wept and sought his favor. He met God at Bethel, and there God spoke with us.'],\n  dt21_17: ['Deuteronomy 21:17', 'But he shall acknowledge the firstborn, the son of the unloved, by giving him a double portion of all that he has, for he is the firstfruits of his strength. The right of the firstborn is his.'],\n  g25_33: ['Genesis 25:33–34', 'Jacob said, “Swear to me now.” So he swore to him and sold his birthright to Jacob. Then Jacob gave Esau bread and lentil stew, and he ate and drank and rose and went his way. Thus Esau despised his birthright.'],\n  g27_19: ['Genesis 27:19', 'Jacob said to his father, “I am Esau your firstborn. I have done as you told me; now sit up and eat of my game, that your soul may bless me.”'],\n  g31_41: ['Genesis 31:41', 'These twenty years I have been in your house. I served you fourteen years for your two daughters, and six years for your flock, and you have changed my wages ten times.'],\n  g32_26: ['Genesis 32:26', 'Then he said, “Let me go, for the day has broken.” But Jacob said, “I will not let you go unless you bless me.”'],\n  g32_28: ['Genesis 32:28', 'Then he said, “Your name shall no longer be called Jacob, but Israel, for you have striven with God and with men, and have prevailed.”'],\n  g33_4: ['Genesis 33:4', 'But Esau ran to meet him and embraced him and fell on his neck and kissed him, and they wept.'],\n  g35_10: ['Genesis 35:10', 'And God said to him, “Your name is Jacob; no longer shall your name be called Jacob, but Israel shall be your name.” So he called his name Israel.'],\n  g28_10: ['Genesis 28:10', 'Jacob left Beersheba and went toward Haran.'],\n  g33_18: ['Genesis 33:18', 'And Jacob came safely to the city of Shechem, which is in the land of Canaan, on his way from Paddan-aram, and he camped before the city.'],\n  g35_27: ['Genesis 35:27', 'And Jacob came to his father Isaac at Mamre, or Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.'],\n  g28_12: ['Genesis 28:12', 'And he dreamed, and behold, there was a ladder set up on the earth, and the top of it reached to heaven. And behold, the angels of God were ascending and descending on it!'],\n  j1_51: ['John 1:51', 'And he said to him, “Truly, truly, I say to you, you will see heaven opened, and the angels of God ascending and descending on the Son of Man.”'],\n  l15_20: ['Luke 15:20', 'And he arose and came to his father. But while he was still a long way off, his father saw him and felt compassion, and ran and embraced him and kissed him.'],\n  m2_18: ['Matthew 2:18', '“A voice was heard in Ramah, weeping and loud lamentation, Rachel weeping for her children; she refused to be comforted, because they are no more.”'],\n  g35_19: ['Genesis 35:19', 'So Rachel died, and she was buried on the way to Ephrath (that is, Bethlehem).'],\n  g36_8: ['Genesis 36:8', 'So Esau settled in the hill country of Seir. (Esau is Edom.)'],\n  num20_14: ['Numbers 20:14', 'Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that we have met.”'],\n  num20_18: ['Numbers 20:18', 'But Edom said to him, “You shall not pass through, lest I come out with the sword against you.”'],\n  sa2_8_14: ['2 Samuel 8:14', 'Then he put garrisons in Edom; throughout all Edom he put garrisons, and all the Edomites became David’s servants. And the LORD gave victory to David wherever he went.'],\n  ps137_7: ['Psalm 137:7', 'Remember, O LORD, against the Edomites the day of Jerusalem, how they said, “Lay it bare, lay it bare, down to its foundations!”'],\n  ob1_10: ['Obadiah 10', 'Because of the violence done to your brother Jacob, shame shall cover you, and you shall be cut off forever.'],\n  mk3_8: ['Mark 3:8', 'and Jerusalem and Idumea and from beyond the Jordan and from around Tyre and Sidon. When the great crowd heard all that he was doing, they came to him.'],\n  m2_1: ['Matthew 2:1', 'Now after Jesus was born in Bethlehem of Judea in the days of Herod the king, behold, wise men from the east came to Jerusalem.'],\n  g27_33: ['Genesis 27:33', 'Then Isaac trembled very violently and said, “Who was it then that hunted game and brought it to me, and I ate it all before you came, and I have blessed him? Yes, and he shall be blessed.”'],\n  g27_36: ['Genesis 27:36', 'Esau said, “Is he not rightly named Jacob? For he has cheated me these two times. He took away my birthright, and behold, now he has taken away my blessing.” Then he said, “Have you not reserved a blessing for me?”'],\n  g27_38: ['Genesis 27:38', 'Esau said to his father, “Have you but one blessing, my father? Bless me, even me also, O my father.” And Esau lifted up his voice and wept.'],\n  g27_40: ['Genesis 27:40', 'By your sword you shall live, and you shall serve your brother; but when you grow restless you shall break his yoke from your neck.'],\n  g27_20: ['Genesis 27:20', 'But Isaac said to his son, “How is it that you have found it so quickly, my son?” He answered, “Because the LORD your God granted me success.”'],\n  g27_13: ['Genesis 27:13', 'His mother said to him, “Let your curse be on me, my son; only obey my voice, and go, bring them to me.”'],\n  g27_41: ['Genesis 27:41', 'Now Esau hated Jacob because of the blessing with which his father had blessed him, and Esau said to himself, “The days of mourning for my father are approaching; then I will kill my brother Jacob.”'],\n  g28_16: ['Genesis 28:16', 'Then Jacob awoke from his sleep and said, “Surely the LORD is in this place, and I did not know it.”'],\n  g29_26: ['Genesis 29:26', 'Laban said, “It is not so done in our country, to give the younger before the firstborn.”'],\n  g29_35: ['Genesis 29:35', 'And she conceived again and bore a son, and said, “This time I will praise the LORD.” Therefore she called his name Judah. Then she ceased bearing.'],\n  g31_7: ['Genesis 31:7', 'Yet your father has cheated me and changed my wages ten times. But God did not permit him to harm me.'],\n  g31_42: ['Genesis 31:42', 'If the God of my father, the God of Abraham and the Fear of Isaac, had not been on my side, surely now you would have sent me away empty-handed. God saw my affliction and the labor of my hands and rebuked you last night.'],\n  g33_9: ['Genesis 33:9', 'But Esau said, “I have enough, my brother; keep what you have for yourself.”'],\n  g33_10: ['Genesis 33:10', 'Jacob said, “No, please, if I have found favor in your sight, then accept my present from my hand. For I have seen your face, which is like seeing the face of God, and you have accepted me.”'],\n  g33_11: ['Genesis 33:11', 'Please accept my blessing that is brought to you, because God has dealt graciously with me, and because I have enough.” Thus he urged him, and he took it.'],\n  g35_11: ['Genesis 35:11', 'And God said to him, “I am God Almighty: be fruitful and multiply. A nation and a company of nations shall come from you, and kings shall come from your own body.”'],\n  g35_29: ['Genesis 35:29', 'And Isaac breathed his last, and he died and was gathered to his people, old and full of days. And his sons Esau and Jacob buried him.'],\n  g25_9: ['Genesis 25:9', 'Isaac and Ishmael his sons buried him in the cave of Machpelah, in the field of Ephron the son of Zohar the Hittite, east of Mamre.'],\n  g26_22: ['Genesis 26:22', 'And he moved from there and dug another well, and they did not quarrel over it. So he called its name Rehoboth, saying, “For now the LORD has made room for us, and we shall be fruitful in the land.”'],\n  g36_31: ['Genesis 36:31', 'These are the kings who reigned in the land of Edom, before any king reigned over the Israelites.'],\n  lk14_26: ['Luke 14:26', '“If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters, yes, and even his own life, he cannot be my disciple.”'],\n  heb12_16: ['Hebrews 12:16–17', 'That no one is sexually immoral or unholy like Esau, who sold his birthright for a single meal. For you know that afterward, when he desired to inherit the blessing, he was rejected, for he found no chance to repent, though he sought it with tears.'],\n  dt2_5: ['Deuteronomy 2:5', 'Do not contend with them, for I will not give you any of their land, no, not so much as for the sole of the foot to step on, because I have given Mount Seir to Esau as a possession.'],\n  rom9_11: ['Romans 9:11', 'Though they were not yet born and had done nothing either good or bad—in order that God’s purpose of election might continue, not because of works but because of him who calls.'],\n  mt5_23: ['Matthew 5:23–24', 'So if you are offering your gift at the altar and there remember that your brother has something against you, leave your gift there before the altar and go. First be reconciled to your brother, and then come and offer your gift.'],\n  ex2_24: ['Exodus 2:24', 'And God heard their groaning, and God remembered his covenant with Abraham, with Isaac, and with Jacob.'],\n  jer31_15: ['Jeremiah 31:15', 'Thus says the LORD: “A voice is heard in Ramah, lamentation and bitter weeping. Rachel is weeping for her children; she refuses to be comforted for her children, because they are no more.”'],\n  g25_30: ['Genesis 25:30', 'And Esau said to Jacob, “Let me eat some of that red stew, for I am exhausted!” (Therefore his name was called Edom.)']\n};\nconst TERMS = {\n  birthright: ['Birthright', 'the oldest son’s double share of everything (Deut. 21:17). Esau sold his for soup.'],\n  blessing: ['Blessing', 'a father’s spoken words over his heir. Once Isaac said them, he couldn’t take them back (27:33).'],\n  bethel: ['Bethel', '“house of God.” Jacob’s name for the spot where he saw the stairway (28:19).'],\n  israel: ['Israel', 'Jacob’s new name, “because you have striven with God and with men, and have prevailed” (32:28).'],\n  edom: ['Edom', 'Esau’s nation, named for the red stew (25:30).']\n};\nconst TABS = ['Overview', 'The Journey', 'If A Student Asks', 'Heads Up', 'Fun Fact', 'New Testament', 'Key Terms'];\nconst ARC = [\n  { label: 'Birthright', ref: 'Gen. 25', verse: 'g25_33', note: 'Jacob is born holding his twin brother’s heel. Years later, Esau comes in from the field starving and trades his birthright for a bowl of stew.' },\n  { label: 'Blessing', ref: 'Gen. 27', verse: 'g27_19', note: 'With goat skins on his arms to feel hairy like Esau, Jacob tricks his blind father Isaac into giving him the blessing.' },\n  { label: 'Bethel', ref: 'Gen. 28', verse: 'g28_15', note: 'His first night on the run, Jacob dreams of a stairway to heaven. God promises to stay with him and bring him home.' },\n  { label: 'Twenty years with Laban', ref: 'Gen. 29–31', verse: 'g31_41', note: 'The trickster gets tricked. Laban swaps brides on the wedding night and changes Jacob’s wages ten times. Jacob leaves with eleven sons, a daughter, and large flocks.' },\n  { label: 'Jabbok', ref: 'Gen. 32', verse: 'g32_26', note: 'Afraid of meeting Esau, Jacob wrestles a stranger all night and won’t let go without a blessing. He leaves limping, renamed Israel.' },\n  { label: 'Esau', ref: 'Gen. 33', verse: 'g33_4', note: 'Jacob expects Esau to come for revenge with 400 men. Instead, Esau runs to him, hugs him, and weeps.' },\n  { label: 'Bethel again', ref: 'Gen. 35', verse: 'g35_10', note: 'Jacob goes back to where it started. God confirms the name Israel and repeats the promise he made to Abraham.' }\n];\nconst W = 760, H = 720;\nconst rad = d => d * Math.PI / 180;\nconst MX = l => rad(l), MY = p => -Math.log(Math.tan(Math.PI / 4 + rad(p) / 2));\nconst X0 = MX(33.6), X1 = MX(40.4), Y0 = MY(37.25), Y1 = MY(30.35);\nconst K = Math.min(W / (X1 - X0), H / (Y1 - Y0));\nconst TX = (W - K * (X1 + X0)) / 2, TY = (H - K * (Y1 + Y0)) / 2;\nconst proj = ([lo, la]) => [K * MX(lo) + TX, K * MY(la) + TY];\nconst LL = { beersheba: [34.79, 31.25], bethel: [35.23, 31.93], haran: [39.03, 36.86], peniel: [35.65, 32.19], shechem: [35.28, 32.21], hebron: [35.10, 31.53] };\nconst LEG_A = [LL.beersheba, LL.bethel, [36.3, 33.6], [37.6, 35.6], LL.haran].map(proj);\nconst LEG_B = [LL.haran, [37.9, 35.2], [36.6, 33.4], LL.peniel, LL.shechem, LL.bethel, LL.hebron].map(proj);\nconst f = n => n.toFixed(1);\nfunction segs(pts, from, to) {\n  let d = `M${f(pts[from][0])},${f(pts[from][1])}`;\n  for (let i = from; i < to; i++) {\n    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];\n    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];\n    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];\n    d += ` C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;\n  }\n  return d;\n}\nconst PLACES = {\n  beersheba: { name: 'Beersheba', sub: 'Gen. 28:10', dx: -14, dy: 24, end: true },\n  bethel: { name: 'Bethel', sub: 'Gen. 28:19; 35:6', dx: -14, dy: 0, end: true },\n  haran: { name: 'Haran', sub: 'Gen. 29–31', dx: -14, dy: -16, end: true },\n  peniel: { name: 'Peniel', sub: 'at the Jabbok · Gen. 32', dx: 14, dy: -4, end: false },\n  shechem: { name: 'Shechem', sub: 'Gen. 33:18', dx: -14, dy: -16, end: true },\n  hebron: { name: 'Mamre (Hebron)', sub: 'Gen. 35:27', dx: -14, dy: 6, end: true }\n};\nconst STEPS = [\n  { place: 'beersheba', name: 'Beersheba', when: 'Genesis 27–28 · leaving home', verse: 'g28_10', seg: null, note: 'Jacob leaves home after stealing Esau’s blessing. Esau is planning to kill him, so Rebekah sends him north to her brother Laban.' },\n  { place: 'bethel', name: 'Bethel', when: 'Genesis 28 · the stairway', verse: 'g28_15', seg: ['A', 0, 1], note: 'First night on the run, sleeping on a stone. Jacob dreams of a stairway to heaven, and God repeats the promise he made to Abraham. Jacob names the place Bethel, “house of God.”' },\n  { place: 'haran', name: 'Haran', when: 'Genesis 29–31 · twenty years with Laban', verse: 'g31_41', seg: ['A', 1, 4], note: 'Twenty years in his uncle Laban’s house. Laban swaps Leah for Rachel on the wedding night. Jacob leaves with two wives, eleven sons, a daughter, and large flocks.' },\n  { place: 'peniel', name: 'Peniel, at the Jabbok', when: 'Genesis 32 · the wrestling', verse: 'g32_28', seg: ['B', 0, 3], note: 'Esau is coming with 400 men. The night before they meet, Jacob wrestles a stranger at the Jabbok River until dawn. He leaves limping, with a new name: Israel.' },\n  { place: 'shechem', name: 'Shechem', when: 'Genesis 33–34 · settling in', verse: 'g33_18', seg: ['B', 3, 4], note: 'After Esau welcomes him, Jacob settles near Shechem and buys land. Genesis 34 happens here (see Heads Up).' },\n  { place: 'bethel', name: 'Bethel, again', when: 'Genesis 35 · back where it started', verse: 'g35_10', seg: ['B', 4, 5], note: 'God sends Jacob back to Bethel. The household gets rid of its idols, and God confirms the name Israel. On the road south, Rachel dies giving birth to Benjamin.' },\n  { place: 'hebron', name: 'Mamre (Hebron)', when: 'Genesis 35 · home', verse: 'g35_27', seg: ['B', 5, 6], note: 'Jacob makes it home to his father Isaac. When Isaac dies, Esau and Jacob bury him together.' }\n];\nconst NT = {\n  john: { title: 'Jacob’s stairway → John 1:51', text: 'Jesus promises Nathanael he’ll see “the angels of God ascending and descending on the Son of Man,” Jesus’ favorite title for himself. That’s Jacob’s stairway (Gen. 28:12), and Jesus says it was about him.', gen: ['g28_12'], nt: ['j1_51'] },\n  luke: { title: 'Esau runs to Jacob → Luke 15:20', text: 'The prodigal son’s father “ran and embraced him and kissed him,” almost word for word what Esau does in Genesis 33:4. In Jesus’ story, God is the one who runs.', gen: ['g33_4'], nt: ['l15_20'] },\n  matt: { title: 'Rachel and Edom → Matthew 2', text: 'The Jacob story shows up at Christmas. Rachel weeps for her children (2:18, quoting Jer. 31:15). And King Herod, who tried to kill the baby Jesus, came from Edom, Esau’s people.', gen: ['g35_19', 'g25_30'], nt: ['m2_18'] }\n};\nconst NATIONS = [\n  { era: 'Genesis', edom: 'Esau settles in Seir. His family grows into the nation of Edom.', e: 'g36_8', israel: 'Jacob, now Israel, settles in Canaan with his twelve sons.', i: 'g32_28', arrow: '↔', arrowColor: 'var(--color-neutral-500)' },\n  { era: 'Wilderness', edom: 'Edom’s king refuses to let Israel pass through his land.', e: 'num20_18', israel: 'Moses asks politely, as “your brother Israel.”', i: 'num20_14', arrow: '←', arrowColor: 'var(--color-text)' },\n  { era: 'Kings', edom: 'Edom becomes King David’s servant.', e: 'sa2_8_14', israel: 'The older serves the younger, as God told Rebekah.', i: 'g25_23', arrow: '→', arrowColor: 'var(--color-accent)' },\n  { era: 'Exile', edom: 'Edom cheers when Babylon destroys Jerusalem. Obadiah condemns it.', e: 'ob1_10', israel: 'Jerusalem falls, and Judah is carried off to Babylon.', i: 'ps137_7', arrow: '←', arrowColor: 'var(--color-text)' },\n  { era: 'Jesus’ day', edom: 'Edom is now called Idumea. Herod the Great, an Idumean, rules as king.', e: 'm2_1', israel: 'Jesus, from Jacob’s line, is born in Bethlehem. Herod tries to kill him.', i: 'm2_18', arrow: '↔', arrowColor: 'var(--color-accent-2)' }\n];\nconst DEEP = [\"What happened between Mount Moriah and Jacob?\",\"Why was a blessing such a big deal?\",\"Why did God let Jacob steal the blessing?\",\"What does it mean that God “hated” Esau?\",\"The deceiver gets deceived\",\"Who did Jacob wrestle, and did he win?\",\"Twenty years of a grudge, and a thousand years of fallout\",\"Genesis 34: the chapter nobody preaches\",\"Back to Bethel, three funerals, and Esau’s kings\",\"The takeaway & sources\"];\nconst NT_GEN = [\n  { label: 'Esau’s Edom', ref: 'Gen. 25:30', g: 'matt', y: 38 },\n  { label: 'Jacob’s stairway', ref: 'Gen. 28:12', g: 'john', y: 126 },\n  { label: 'Esau runs to Jacob', ref: 'Gen. 33:4', g: 'luke', y: 214 },\n  { label: 'Rachel', ref: 'Gen. 35:19', g: 'matt', y: 302 }\n];\nconst NT_NEW = [\n  { label: 'Matthew 2', sub: 'Rachel weeps; Herod the Edomite', g: 'matt', y: 52 },\n  { label: 'Luke 15:20', sub: 'The father runs', g: 'luke', y: 170 },\n  { label: 'John 1:51', sub: 'Angels on the Son of Man', g: 'john', y: 288 }\n];\n\nclass Component extends DCLogic {\n  state = { mode: 'quick', ch: 0, tab: 0, arc: 2, step: 0, q: [true, false, false], nt: 'john', pop: null };\n  componentDidMount() {\n    this._key = e => {\n      if (e.key === 'Escape') this.setState({ pop: null });\n      if (this.state.tab === 1 && e.key === 'ArrowRight') this.go(1);\n      if (this.state.tab === 1 && e.key === 'ArrowLeft') this.go(-1);\n    };\n    window.addEventListener('keydown', this._key);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); }\n  go(d) { this.setState(s => ({ step: Math.max(0, Math.min(STEPS.length - 1, s.step + d)) })); }\n  open(kind, key, e) {\n    const vw = window.innerWidth, vh = window.innerHeight;\n    const r = e.currentTarget.getBoundingClientRect();\n    const left = Math.max(12, Math.min(vw - 352, r.left + r.width / 2 - 170));\n    const below = r.bottom < vh * 0.6;\n    this.setState({ pop: { kind, key, left: left + 'px', top: below ? (r.bottom + 10) + 'px' : 'auto', bottom: below ? 'auto' : (vh - r.top + 10) + 'px' } });\n  }\n  setCh(i) { this.setState({ ch: Math.max(0, Math.min(DEEP.length - 1, i)), pop: null }); window.scrollTo(0, 0); }\n  setMode(m) { this.setState({ mode: m, pop: null }); window.scrollTo(0, 0); }\n  setTab(i) { this.setState({ tab: i, pop: null }); window.scrollTo(0, 0); }\n  renderVals() {\n    const s = this.state;\n    const v = {}; Object.keys(VERSES).forEach(k => { v[k] = e => this.open('verse', k, e); });\n    const t = {}; Object.keys(TERMS).forEach(k => { t[k] = e => this.open('term', k, e); });\n    const pt = k => proj(LL[k]);\n    const places = Object.entries(PLACES).map(([k, p]) => {\n      const [x, y] = pt(k);\n      return { ...p, x, y, lx: x + p.dx, ly: y + p.dy, ly2: y + p.dy + 17, go: () => this.setState({ step: STEPS.findIndex(st => st.place === k) }) };\n    });\n    const st = STEPS[s.step];\n    const [ax, ay] = pt(st.place);\n    const seg = st.seg ? segs(st.seg[0] === 'A' ? LEG_A : LEG_B, st.seg[1], st.seg[2]) : '';\n    const arcSel = ARC[s.arc];\n    const pop = s.pop;\n    let popTitle = '', popText = '', popFoot = '', popColor = 'var(--color-accent)';\n    if (pop) {\n      if (pop.kind === 'verse') { [popTitle, popText] = VERSES[pop.key]; popFoot = 'ESV'; }\n      else { [popTitle, popText] = TERMS[pop.key]; popFoot = 'Key term'; popColor = 'var(--color-accent-2)'; }\n    }\n    const toggle = i => () => this.setState(x => { const q = x.q.slice(); q[i] = !q[i]; return { q }; });\n    const sel = g => g === s.nt;\n    return {\n      showTimeline: this.props.showTimeline ?? true,\n      showSources: this.props.showSources ?? true,\n      v, t,\n      tabs: TABS.map((label, i) => ({ label, go: () => this.setTab(i), color: i === s.tab ? 'var(--color-text)' : 'var(--color-neutral-700)', line: i === s.tab ? 'var(--color-accent)' : 'transparent' })),\n      isOverview: s.tab === 0, isJourney: s.tab === 1, isQA: s.tab === 2, isHeads: s.tab === 3, isFun: s.tab === 4, isNT: s.tab === 5, isTerms: s.tab === 6,\n      prevTab: () => s.tab > 0 && this.setTab(s.tab - 1),\n      nextTab: () => s.tab < TABS.length - 1 && this.setTab(s.tab + 1),\n      prevLabel: s.tab > 0 ? '← ' + TABS[s.tab - 1] : '',\n      nextLabel: s.tab < TABS.length - 1 ? TABS[s.tab + 1] + ' →' : '',\n      storyBefore: ['Creation', 'Fall', 'Flood', 'Abraham', 'Isaac'],\n      storyAfter: ['Joseph', 'Exodus', 'Sinai', 'David', 'Exile', 'Jesus', 'New Creation'],\n      arc: ARC.map((a, i) => ({ ...a, go: () => this.setState({ arc: i }), h: i === s.arc ? 16 : 8, bar: i === s.arc ? 'var(--color-accent-700)' : 'var(--color-accent-300)', ink: i === s.arc ? 'var(--color-accent-800)' : 'var(--color-text)' })),\n      arcSel: { ...arcSel, verseRef: VERSES[arcSel.verse][0], read: e => this.open('verse', arcSel.verse, e) },\n      routeOut: segs(LEG_A, 0, LEG_A.length - 1),\n      routeBack: segs(LEG_B, 0, LEG_B.length - 1),\n      activeSeg: seg, activeX: ax, activeY: ay,\n      placesEnd: places.filter(p => p.end), placesStart: places.filter(p => !p.end),\n      mapLabels: places.map(p => ({ name: p.name, sub: p.sub, go: p.go, left: (p.lx / W * 100) + '%', top: (p.ly / H * 100) + '%', tf: p.end ? 'translate(-100%, -75%)' : 'translate(0, -75%)', align: p.end ? 'right' : 'left' })),\n      stepNum: s.step + 1, stepTotal: STEPS.length,\n      stepDots: STEPS.map((x, i) => ({ n: i + 1, name: x.name, go: () => this.setState({ step: i }), bg: i === s.step ? 'var(--color-accent-2)' : (i < s.step ? 'var(--color-accent-2-100)' : 'transparent'), border: i <= s.step ? 'var(--color-accent-2)' : 'var(--color-neutral-400)', ink: i === s.step ? '#fff' : 'var(--color-text)' })),\n      step: { ...st, verseRef: VERSES[st.verse][0], read: e => this.open('verse', st.verse, e) },\n      prevStep: () => this.go(-1), nextStep: () => this.go(1),\n      q1Open: s.q[0], q2Open: s.q[1], q3Open: s.q[2],\n      q1Sign: s.q[0] ? '–' : '+', q2Sign: s.q[1] ? '–' : '+', q3Sign: s.q[2] ? '–' : '+',\n      toggleQ1: toggle(0), toggleQ2: toggle(1), toggleQ3: toggle(2),\n      words: [\n        { he: 'יַעֲקֹב', pre: 'Ya‘', hit: 'aqo', post: 'v', gloss: 'Jacob' },\n        { he: 'וַיֵּאָבֵק', pre: 'vayye’', hit: 'aveq', post: '', gloss: 'and he wrestled' },\n        { he: 'יַבֹּק', pre: 'Ya', hit: 'bboq', post: '', gloss: 'Jabbok, the river' }\n      ],\n      ntGen: NT_GEN.map(x => ({ ...x, go: () => this.setState({ nt: x.g }), bg: sel(x.g) ? 'var(--color-accent-100)' : '#fff', border: sel(x.g) ? 'var(--color-accent)' : 'var(--color-neutral-300)' })),\n      ntNew: NT_NEW.map(x => ({ ...x, go: () => this.setState({ nt: x.g }), bg: sel(x.g) ? 'var(--color-accent-100)' : '#fff', border: sel(x.g) ? 'var(--color-accent)' : 'var(--color-neutral-300)' })),\n      ntLines: NT_GEN.map(g => { const n = NT_NEW.find(x => x.g === g.g); return { y1: g.y, y2: n.y, d: `M0,${g.y} C80,${g.y} 80,${n.y} 160,${n.y}`, stroke: sel(g.g) ? 'var(--color-accent)' : 'var(--color-neutral-300)', w: sel(g.g) ? 3 : 1.5 }; }),\n      ntSel: { ...NT[s.nt], gen: NT[s.nt].gen.map(k => ({ ref: VERSES[k][0], text: VERSES[k][1] })), nt: NT[s.nt].nt.map(k => ({ ref: VERSES[k][0], text: VERSES[k][1] })) },\n      nations: NATIONS.map(r => ({ ...r, refE: VERSES[r.e][0], refI: VERSES[r.i][0], readE: e => this.open('verse', r.e, e), readI: e => this.open('verse', r.i, e) })),\n      terms: Object.values(TERMS).map(([term, def]) => ({ term, def })),\n      isQuick: s.mode === 'quick', isDeep: s.mode === 'deep',\n      setDeep: () => this.setMode('deep'),\n      modes: [['quick', 'Teacher Notes', 'Quick summary · 10 min'], ['deep', 'Going Deeper', 'The long read · 9 questions']].map(([k, label, sub]) => ({ label, sub, go: () => this.setMode(k), bg: s.mode === k ? 'var(--color-accent)' : 'transparent', ink: s.mode === k ? '#fff' : 'var(--color-text)' })),\n      ch: Object.fromEntries(DEEP.map((_, i) => ['c' + i, s.ch === i])),\n      deepNav: DEEP.map((title, i) => ({ title, n: i < 9 ? String(i + 1) : '★', go: () => this.setCh(i), bg: s.ch === i ? 'var(--color-accent-100)' : 'transparent', line: s.ch === i ? 'var(--color-accent)' : 'transparent', ink: s.ch === i ? 'var(--color-accent-900)' : 'var(--color-text)' })),\n      deepPrev: () => s.ch > 0 && this.setCh(s.ch - 1),\n      deepNext: () => s.ch < DEEP.length - 1 && this.setCh(s.ch + 1),\n      deepPrevLabel: s.ch > 0 ? '← ' + DEEP[s.ch - 1] : '',\n      deepNextLabel: s.ch < DEEP.length - 1 ? DEEP[s.ch + 1] + ' →' : '',\n      popOpen: !!pop, closePop: () => this.setState({ pop: null }),\n      popLeft: pop ? pop.left : '0', popTop: pop ? pop.top : 'auto', popBottom: pop ? pop.bottom : 'auto',\n      popTitle, popText, popFoot, popColor\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
