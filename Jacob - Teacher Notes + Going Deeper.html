document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

    the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); } { isDeep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:20px; border-bottom:1px solid var(--color-neutral-300);\"><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ true }}\">\n    <nav style=\"display:flex; gap:4px; flex-wrap:wrap; margin-top:26px; border-bottom:1px solid var(--color-neutral-300);\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ tb.go }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:12px 14px 11px; margin-bottom:-1px; font-family:var(--font-heading); font-size:15px; font-weight:600; color:{{ tb.color }}; border-bottom:3px solid {{ tb.line }};\" style-hover=\"color:var(--color-accent-700);\">{{ tb.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:36px 40px 0;\">\n\n    <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-if value=\"{{ showTimeline }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom:44px;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-neutral-700);\">The One Story<\u002Fdiv>\n          <div style=\"position:relative; margin-top:32px; display:grid; grid-template-columns:repeat(13, minmax(0,1fr));\">\n            <div style=\"position:absolute; left:3.8%; right:3.8%; top:5px; height:1px; background:var(--color-neutral-400);\"><\u002Fdiv>\n            <sc-for list=\"{{ storyBefore }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n                <div style=\"width:11px; height:11px; border-radius:50%; background:var(--color-neutral-500); box-shadow:0 0 0 3px var(--color-bg);\"><\u002Fdiv>\n                <div style=\"font-size:13px; line-height:1.15; text-align:center; color:var(--color-neutral-700);\">{{ s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n              <div style=\"position:absolute; top:-26px; white-space:nowrap; font-family:var(--font-heading); font-size:10px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-accent-2-700);\">You are here<\u002Fdiv>\n              <div style=\"width:15px; height:15px; margin-top:-2px; border-radius:50%; background:var(--color-accent-2); box-shadow:0 0 0 3px var(--color-bg), 0 0 0 4px var(--color-accent-2);\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-weight:600; font-size:13px; line-height:1.15; text-align:center; color:var(--color-accent-2-800);\">Jacob becomes Israel<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ storyAfter }}\" as=\"s\" hint-placeholder-count=\"7\">\n              <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n                <div style=\"width:11px; height:11px; border-radius:50%; background:var(--color-bg); border:1.5px solid var(--color-neutral-500); box-sizing:border-box; box-shadow:0 0 0 3px var(--color-bg);\"><\u002Fdiv>\n                <div style=\"font-size:13px; line-height:1.15; text-align:center; color:var(--color-neutral-700);\">{{ s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; align-items:start;\">\n        <section>\n          <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">01 · Where We Are<\u002Fdiv>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\">God’s promise to Abraham passes to a con man. Abraham’s grandson Jacob spends Genesis 25–35 grabbing whatever he can, starting with his brother’s <span sc-camel-on-click=\"{{ t.birthright }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">birthright<\u002Fspan> and his father’s <span sc-camel-on-click=\"{{ t.blessing }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">blessing<\u002Fspan>. After twenty years on the run, he wrestles a stranger at a river and walks away limping, with a new name. The nation of <span sc-camel-on-click=\"{{ t.israel }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">Israel<\u002Fspan> is named after him.<\u002Fp>\n        <\u002Fsection>\n        <section>\n          <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">02 · Big Idea<\u002Fdiv>\n          <p style=\"font-size:18px; line-height:1.65; margin:14px 0 0; text-wrap:pretty;\">God didn’t choose Jacob because he was good. He held on to Jacob until Jacob became Israel: “I will not leave you until I have done what I have promised you” (<span sc-camel-on-click=\"{{ v.g28_15 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">28:15<\u002Fspan>). Centuries later, God introduces himself to Moses as “the God of Abraham, the God of Isaac, and the God of Jacob” (<span sc-camel-on-click=\"{{ v.ex3_6 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Ex. 3:6<\u002Fspan>). He put his own name next to a cheater’s.<\u002Fp>\n          <p style=\"font-family:var(--font-heading); font-weight:600; font-size:23px; line-height:1.35; margin:22px 0 0; color:var(--color-accent-800);\">“I will not leave you until I have done what I have promised you” (28:15).<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <section style=\"margin-top:56px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-neutral-700);\">Genesis 25–35 at a glance<\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--color-neutral-700);\">Click a chapter<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr 2.6fr 1fr 1fr 1fr; gap:4px; margin-top:14px;\">\n          <sc-for list=\"{{ arc }}\" as=\"a\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ a.go }}\" style=\"appearance:none; border:none; background:transparent; padding:0; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:7px; min-width:0;\" style-hover=\"opacity:0.8;\">\n              <div style=\"height:{{ a.h }}px; background:{{ a.bar }}; transition:height .15s;\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-weight:600; font-size:14px; line-height:1.2; color:{{ a.ink }};\">{{ a.label }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700);\">{{ a.ref }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px; display:grid; grid-template-columns:200px minmax(0,1fr); gap:28px; padding:22px 26px; background:var(--color-accent-100); border-top:2px solid var(--color-accent);\">\n          <div>\n            <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent-800);\">{{ arcSel.ref }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:24px; line-height:1.15; margin-top:6px; color:var(--color-accent-900);\">{{ arcSel.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-size:17px; line-height:1.6; margin:0; color:var(--color-accent-900);\">{{ arcSel.note }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ arcSel.read }}\" style=\"appearance:none; border:none; background:transparent; padding:0; margin-top:12px; cursor:pointer; font-size:15px; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"color:var(--color-accent-900);\">Read {{ arcSel.verseRef }} →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isJourney }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:40px; align-items:start;\">\n        <figure style=\"margin:0;\">\n          <div style=\"position:relative; width:100%; aspect-ratio:760 / 720; border:1px solid var(--color-neutral-300); background:#fbfaf9;\">\n            <img src=\"bb3eb38b-a62b-4f16-885c-6271f02471a9\" alt=\"Map of Canaan and Paddan-aram\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\">\n            <svg sc-camel-view-box=\"0 0 760 720\" style=\"position:absolute; inset:0; width:100%; height:100%; overflow:visible;\">\n              <path d=\"{{ routeOut }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.6\" stroke-dasharray=\"7 5\"><\u002Fpath>\n              <path d=\"{{ routeBack }}\" fill=\"none\" stroke=\"var(--color-text)\" stroke-width=\"2.2\"><\u002Fpath>\n              <path d=\"{{ activeSeg }}\" fill=\"none\" stroke=\"var(--color-accent-2)\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n              <circle cx=\"{{ activeX }}\" cy=\"{{ activeY }}\" r=\"14\" fill=\"none\" stroke=\"var(--color-accent-2)\" stroke-width=\"2.5\"><\u002Fcircle>\n              <sc-for list=\"{{ placesEnd }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <g sc-camel-on-click=\"{{ p.go }}\" style=\"cursor:pointer;\">\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"16\" fill=\"transparent\"><\u002Fcircle>\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"6\" fill=\"var(--color-text)\" stroke=\"#fff\" stroke-width=\"1.6\"><\u002Fcircle>\n                <\u002Fg>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ placesStart }}\" as=\"p\" hint-placeholder-count=\"1\">\n                <g sc-camel-on-click=\"{{ p.go }}\" style=\"cursor:pointer;\">\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"16\" fill=\"transparent\"><\u002Fcircle>\n                  <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"6\" fill=\"var(--color-text)\" stroke=\"#fff\" stroke-width=\"1.6\"><\u002Fcircle>\n                <\u002Fg>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <sc-for list=\"{{ mapLabels }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ m.go }}\" style=\"position:absolute; left:{{ m.left }}; top:{{ m.top }}; transform:{{ m.tf }}; text-align:{{ m.align }}; cursor:pointer; white-space:nowrap; line-height:1.15; text-shadow:0 0 3px #fbfaf9, 0 0 3px #fbfaf9, 0 0 3px #fbfaf9;\">\n                <div style=\"font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-text);\">{{ m.name }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-700);\">{{ m.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; padding:10px 12px; background:rgba(255,255,255,0.92); font-size:13px;\">\n              <div style=\"display:flex; align-items:center; gap:10px;\"><div style=\"width:30px; border-top:2.6px dashed var(--color-accent);\"><\u002Fdiv>Running away · Gen. 28<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:10px;\"><div style=\"width:30px; border-top:2.2px solid var(--color-text);\"><\u002Fdiv>Coming home · Gen. 31–35<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption style=\"font-size:13px; line-height:1.5; margin-top:10px; color:var(--color-neutral-700);\">Jacob runs north from Beersheba to his uncle Laban in Haran, then comes home by way of the Jabbok, where he wrestles at Peniel. Sites approximate. Map data: Natural Earth.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <aside style=\"position:sticky; top:20px;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-neutral-700);\">Stop {{ stepNum }} of {{ stepTotal }}<\u002Fdiv>\n          <div style=\"display:flex; gap:6px; margin-top:12px;\">\n            <sc-for list=\"{{ stepDots }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <button sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.name }}\" style=\"appearance:none; cursor:pointer; width:30px; height:30px; border-radius:50%; border:1.5px solid {{ d.border }}; background:{{ d.bg }}; color:{{ d.ink }}; font-family:var(--font-heading); font-size:13px; font-weight:600; padding:0;\">{{ d.n }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <h2 style=\"font-family:var(--font-heading); font-weight:600; font-size:32px; line-height:1.1; margin:22px 0 0;\">{{ step.name }}<\u002Fh2>\n          <div style=\"font-size:14px; margin-top:6px; color:var(--color-neutral-700);\">{{ step.when }}<\u002Fdiv>\n          <p style=\"font-size:17px; line-height:1.62; margin:16px 0 0; text-wrap:pretty;\">{{ step.note }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ step.read }}\" style=\"appearance:none; border:none; background:transparent; padding:0; margin-top:14px; cursor:pointer; font-size:15px; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"color:var(--color-accent-900);\">Read {{ step.verseRef }} →<\u002Fbutton>\n          <div style=\"display:flex; gap:10px; margin-top:28px;\">\n            <button sc-camel-on-click=\"{{ prevStep }}\" style=\"appearance:none; cursor:pointer; padding:10px 16px; border:1px solid var(--color-neutral-400); background:transparent; border-radius:var(--radius-sm, 2px); font-family:var(--font-heading); font-size:14px; font-weight:600; color:var(--color-text);\" style-hover=\"background:var(--color-accent-100); border-color:var(--color-accent);\">← Previous<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ nextStep }}\" style=\"appearance:none; cursor:pointer; padding:10px 16px; border:1px solid var(--color-accent); background:var(--color-accent); border-radius:var(--radius-sm, 2px); font-family:var(--font-heading); font-size:14px; font-weight:600; color:#fff;\" style-hover=\"background:var(--color-accent-600);\">Next stop →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isQA }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">03 · If A Student Asks<\u002Fdiv>\n      <div style=\"max-width:820px; margin-top:16px; border-top:1.5px solid var(--color-text);\">\n\n        <div style=\"border-bottom:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ toggleQ1 }}\" style=\"appearance:none; border:none; background:transparent; width:100%; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) 32px; gap:12px; align-items:center; padding:20px 0; text-align:left;\" style-hover=\"background:var(--color-accent-100);\">\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; color:var(--color-accent); padding-left:6px;\">Q<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; line-height:1.3; color:var(--color-text);\">“Did God really hate Esau?”<\u002Fspan>\n            <span style=\"font-size:24px; color:var(--color-accent-700);\">{{ q1Sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ q1Open }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:0 44px 26px 52px;\">\n              <div style=\"font-size:14px; color:var(--color-neutral-700);\">(<span sc-camel-on-click=\"{{ v.mal1_2 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Malachi 1:2–3<\u002Fspan>; <span sc-camel-on-click=\"{{ v.rom9_13 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Romans 9:13<\u002Fspan>)<\u002Fdiv>\n              <p style=\"font-size:17px; line-height:1.65; margin:10px 0 0; text-wrap:pretty;\">It means God chose Jacob’s line, and Genesis shows how the word works. Jacob “loved Rachel more than Leah,” and the next verse uses the same Hebrew word Malachi uses: Leah was “hated” (<span sc-camel-on-click=\"{{ v.g29_30 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">29:30–31<\u002Fspan>; some translations say “unloved”). It means loved less. God even told Israel, “You shall not abhor an Edomite, for he is your brother” (<span sc-camel-on-click=\"{{ v.dt23_7 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Deut. 23:7<\u002Fspan>). Christians still debate what Romans 9 says about God choosing individuals; the Going Deeper lays out both views.<\u002Fp>\n              <div style=\"margin:20px 0 0; border-top:1.5px solid var(--color-text); border-bottom:1.5px solid var(--color-text);\">\n                <div style=\"display:grid; grid-template-columns:150px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:9px 0; border-bottom:1px solid var(--color-neutral-300); font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-neutral-700);\"><div>Passage<\u002Fdiv><div>Loved<\u002Fdiv><div>“Hated”<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:150px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); font-size:16px;\"><div style=\"font-weight:600;\">Genesis 29:30–31<\u002Fdiv><div>Rachel<\u002Fdiv><div>Leah, who is still Jacob’s wife<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:150px minmax(0,1fr) minmax(0,1fr); gap:12px; padding:11px 0; font-size:16px;\"><div style=\"font-weight:600;\">Malachi 1:2–3<\u002Fdiv><div>Jacob<\u002Fdiv><div>Esau, still Israel’s “brother” (Deut. 23:7)<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; margin:8px 0 0; color:var(--color-neutral-700);\">Same Hebrew word, same pattern: one is loved more, the other loved less.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ toggleQ2 }}\" style=\"appearance:none; border:none; background:transparent; width:100%; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) 32px; gap:12px; align-items:center; padding:20px 0; text-align:left;\" style-hover=\"background:var(--color-accent-100);\">\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; color:var(--color-accent); padding-left:6px;\">Q<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; line-height:1.3; color:var(--color-text);\">“Why did God bless a liar?”<\u002Fspan>\n            <span style=\"font-size:24px; color:var(--color-accent-700);\">{{ q2Sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ q2Open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 44px 26px 52px;\">\n              <p style=\"font-size:17px; line-height:1.65; margin:0; text-wrap:pretty;\">Because God had already chosen Jacob, and Genesis still makes him pay for the lie. Before the twins were born, God told Rebekah the older would serve the younger (<span sc-camel-on-click=\"{{ v.g25_23 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">25:23<\u002Fspan>), but Isaac called in Esau alone to bless him anyway (<span sc-camel-on-click=\"{{ v.g27_1 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">27:1–4<\u002Fspan>). Jacob got the <span sc-camel-on-click=\"{{ t.blessing }}\" style=\"cursor:pointer; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">blessing<\u002Fspan> and lost twenty years. He ran for his life, and his uncle Laban out-tricked him, by switching brides on him.<\u002Fp>\n              <div style=\"margin:18px 0 0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px;\">\n                <div style=\"padding:14px 16px; background:var(--color-accent-100); border-top:2px solid var(--color-accent);\">\n                  <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-accent-800);\">What Jacob gets<\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.45; margin-top:6px; color:var(--color-accent-900);\">The blessing God already promised him (25:23)<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 16px; background:var(--color-neutral-100); border-top:2px solid var(--color-text);\">\n                  <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-neutral-800);\">What the lie costs<\u002Fdiv>\n                  <div style=\"font-size:16px; line-height:1.45; margin-top:6px;\">Twenty years on the run, out-tricked by Laban<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; margin:8px 0 0; color:var(--color-neutral-700);\">God keeps his choice; Genesis still sends the bill.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"border-bottom:1px solid var(--color-neutral-300);\">\n          <button sc-camel-on-click=\"{{ toggleQ3 }}\" style=\"appearance:none; border:none; background:transparent; width:100%; cursor:pointer; display:grid; grid-template-columns:40px minmax(0,1fr) 32px; gap:12px; align-items:center; padding:20px 0; text-align:left;\" style-hover=\"background:var(--color-accent-100);\">\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; color:var(--color-accent); padding-left:6px;\">Q<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; line-height:1.3; color:var(--color-text);\">“Did Jacob beat God in a wrestling match?”<\u002Fspan>\n            <span style=\"font-size:24px; color:var(--color-accent-700);\">{{ q3Sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ q3Open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 44px 26px 52px;\">\n              <p style=\"font-size:17px; line-height:1.65; margin:0; text-wrap:pretty;\">No. With a single touch, the man threw Jacob’s hip out of joint (<span sc-camel-on-click=\"{{ v.g32_25 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">32:25<\u002Fspan>). He could have ended it any time. Jacob “won” by refusing to let go, and for once he asked for a blessing instead of stealing one. Jacob said he’d seen God face to face (<span sc-camel-on-click=\"{{ v.g32_30 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">32:30<\u002Fspan>), and <span sc-camel-on-click=\"{{ v.hos12_4 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Hosea 12:4<\u002Fspan> calls the wrestler an angel. Either way, Jacob met God that night.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHeads }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">04 · Heads Up<\u002Fdiv>\n      <div style=\"max-width:720px; margin-top:16px; padding:6px 0 6px 24px; border-left:3px solid var(--color-text);\">\n        <p style=\"font-size:18px; line-height:1.65; margin:0; text-wrap:pretty;\">Genesis 34 tells how Jacob’s daughter Dinah was raped and how her brothers then massacred a town. Students who read ahead may find it. If one asks, keep it brief (or follow up privately): a terrible wrong was done to Dinah, Shechem was guilty, and her brothers’ revenge was wrong too (Jacob condemns it in 49:5–7). Don’t suggest Dinah was to blame for going out. Some older commentators, including John Calvin, said that although the text clearly doesn’t.<\u002Fp>\n        <p style=\"font-size:18px; line-height:1.65; margin:16px 0 0; text-wrap:pretty;\">If students ask how Jacob married the wrong sister without noticing, the text only says it was evening (29:23). Best to leave it there.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFun }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">05 · Fun Fact<\u002Fdiv>\n      <p style=\"font-size:20px; line-height:1.6; margin:16px 0 0; max-width:60ch; text-wrap:pretty;\">In Hebrew, Jacob, wrestled, and Jabbok (the river) all sound alike. The night Jacob finally holds on to God is told as a play on his own name.<\u002Fp>\n      <div style=\"max-width:860px; margin-top:28px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border-top:1.5px solid var(--color-text); border-bottom:1.5px solid var(--color-text);\">\n        <sc-for list=\"{{ words }}\" as=\"w\" hint-placeholder-count=\"3\">\n          <div style=\"padding:22px 16px 22px 0; display:flex; flex-direction:column; gap:8px;\">\n            <div lang=\"he\" dir=\"rtl\" style=\"font-family:'Noto Serif Hebrew', serif; font-weight:500; font-size:44px; line-height:1.2; text-align:left;\">{{ w.he }}<\u002Fdiv>\n            <div style=\"font-style:italic; font-size:22px;\">{{ w.pre }}<span style=\"font-style:normal; font-weight:600; color:var(--color-accent-2-700);\">{{ w.hit }}<\u002Fspan>{{ w.post }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-neutral-700);\">{{ w.gloss }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:13px; line-height:1.5; margin:10px 0 0; color:var(--color-neutral-700);\">The three words share the same rough “-aq-” / “-bq-” sound, marked in magenta (Gen. 32:22–24). Transliterations simplified.<\u002Fp>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isNT }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">06 · Found in the New Testament<\u002Fdiv>\n      <p style=\"font-size:18px; line-height:1.6; margin:14px 0 0;\">Three threads from Jacob’s story that the Gospels pick back up. Click any passage to follow its thread.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 160px minmax(0,1fr); margin-top:24px; max-width:900px;\">\n        <div>\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:10px;\">In Genesis<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ ntGen }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ g.go }}\" style=\"appearance:none; cursor:pointer; height:76px; box-sizing:border-box; padding:0 16px; text-align:left; display:flex; flex-direction:column; justify-content:center; gap:4px; border:1px solid {{ g.border }}; background:{{ g.bg }};\" style-hover=\"border-color:var(--color-accent);\">\n                <span style=\"font-family:var(--font-heading); font-weight:600; font-size:17px; color:var(--color-text);\">{{ g.label }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ g.ref }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding-top:29px;\">\n          <svg width=\"160\" height=\"340\" sc-camel-view-box=\"0 0 160 340\" style=\"display:block;\">\n            <sc-for list=\"{{ ntLines }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <path d=\"{{ l.d }}\" fill=\"none\" stroke=\"{{ l.stroke }}\" stroke-width=\"{{ l.w }}\"><\u002Fpath>\n              <circle cx=\"0\" cy=\"{{ l.y1 }}\" r=\"4\" fill=\"{{ l.stroke }}\"><\u002Fcircle>\n              <circle cx=\"160\" cy=\"{{ l.y2 }}\" r=\"4\" fill=\"{{ l.stroke }}\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:10px;\">In the New Testament<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ ntNew }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ n.go }}\" style=\"appearance:none; cursor:pointer; height:104px; box-sizing:border-box; padding:0 16px; text-align:left; display:flex; flex-direction:column; justify-content:center; gap:4px; border:1px solid {{ n.border }}; background:{{ n.bg }};\" style-hover=\"border-color:var(--color-accent);\">\n                <span style=\"font-family:var(--font-heading); font-weight:600; font-size:19px; color:var(--color-text);\">{{ n.label }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ n.sub }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:32px; max-width:900px; padding:24px 28px; background:var(--color-accent-100); border-top:2px solid var(--c max(0,1fr); gap:56px; margin-top:16px; align-items:start;\">\n        <div style=\"border-top:1.5px solid var(--color-text);\">\n          <sc-for list=\"{{ terms }}\" as=\"tm\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:16px; padding:14px 0; border-bottom:1px solid var(--color-neutral-300);\">\n              <div style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">{{ tm.term }}<\u002Fdiv>\n              <div style=\"font-size:16px; line-height:1.55;\">{{ tm.def }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:40px;\">\n          <div>\n            <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:14px;\">The birthright · <span sc-camel-on-click=\"{{ v.dt21_17 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\">Deut. 21:17<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:120px auto; align-items:center; gap:12px 10px;\">\n              <div style=\"font-size:15px;\">Firstborn<\u002Fdiv>\n              <div style=\"display:flex; gap:6px;\"><div style=\"width:28px; height:28px; border-radius:50%; background:var(--color-accent);\"><\u002Fdiv><div style=\"width:28px; height:28px; border-radius:50%; background:var(--color-accent);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:15px;\">Each other son<\u002Fdiv>\n              <div style=\"display:flex; gap:6px;\"><div style=\"width:28px; height:28px; border-radius:50%; background:var(--color-neutral-400);\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:13px; line-height:1.5; margin:12px 0 0; color:var(--color-neutral-700);\">The oldest son’s double share. This is what Esau traded for a bowl of red stew.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section style=\"margin-top:64px;\">\n        <div style=\"font-family:var(--font-heading); font-size:22px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-text);\">Two Brothers, Two Nations<\u002Fdiv>\n        <p style=\"font-size:18px; line-height:1.6; margin:12px 0 0; max-width:64ch; text-wrap:pretty;\">Before the twins were born, God told Rebekah, “Two nations are in your womb” (<span sc-camel-on-click=\"{{ v.g25_23 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">25:23<\u002Fspan>). Esau’s family became Edom. Jacob’s became Israel. The two nations stayed neighbors, and rivals, all the way to the time of Jesus.<\u002Fp>\n\n        <div style=\"margin-top:32px; display:flex; flex-direction:column; align-items:center;\">\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:19px;\">Abraham<\u002Fdiv>\n          <div style=\"width:1px; height:16px; background:var(--color-neutral-500);\"><\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:19px;\">Isaac <span style=\"font-weight:400; font-size:15px; color:var(--color-neutral-700);\">+ Rebekah<\u002Fspan><\u002Fdiv>\n          <div style=\"width:1px; height:16px; background:var(--color-neutral-500);\"><\u002Fdiv>\n          <div style=\"font-size:13px; letter-spacing:0.08em; color:var(--color-neutral-700);\">twins<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr); margin-top:0;\">\n          <div style=\"height:18px; border-top:1px solid var(--color-neutral-500); border-left:1px solid var(--color-neutral-500); margin-left:50%;\"><\u002Fdiv>\n          <div style=\"height:18px; border-top:1px solid var(--color-neutral-500);\"><\u002Fdiv>\n          <div style=\"height:18px; border-top:1px solid var(--color-neutral-500); border-right:1px solid var(--color-neutral-500); margin-right:50%;\"><\u002Fdiv>\n\n          <div style=\"padding:16px 20px 18px; background:var(--color-neutral-100); border-top:3px solid var(--color-text);\">\n            <div style=\"font-size:13px; color:var(--color-neutral-700);\">older twin<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; line-height:1.1;\">Esau<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.5; margin-top:8px;\">Born red and hairy. Nation: <span sc-camel-on-click=\"{{ t.edom }}\" style=\"cursor:pointer; font-weight:600; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">Edom<\u002Fspan>, “red.”<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.5; margin-top:4px;\">Land: the hill country of Seir, south and east of the Dead Sea (<span sc-camel-on-click=\"{{ v.g36_8 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">36:8<\u002Fspan>).<\u002Fdiv>\n          <\u002Fdiv>\n          <div><\u002Fdiv>\n          <div style=\"padding:16px 20px 18px; background:var(--color-accent-100); border-top:3px solid var(--color-accent);\">\n            <div style=\"font-size:13px; color:var(--color-accent-800);\">younger twin<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading); font-weight:600; font-size:28px; line-height:1.1; color:var(--color-accent-900);\">Jacob<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.5; margin-top:8px; color:var(--color-accent-900);\">Born holding Esau’s heel. Nation: <span sc-camel-on-click=\"{{ t.israel }}\" style=\"cursor:pointer; font-weight:600; border-bottom:1.5px dotted var(--color-accent-2);\" style-hover=\"background:var(--color-accent-2-100);\">Israel<\u002Fspan>, his new name.<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.5; margin-top:4px; color:var(--color-accent-900);\">Land: Canaan, west of the Jordan. His twelve sons become the twelve tribes.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:28px; display:flex; justify-content:space-between; align-items:baseline; gap:12px;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-neutral-700);\">The brothers’ story through the Bible<\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--color-neutral-700);\">Click a reference to read it<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px; border-top:1.5px solid var(--color-text);\">\n          <sc-for list=\"{{ nations }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr); border-bottom:1px solid var(--color-neutral-300);\" style-hover=\"background:var(--color-neutral-100);\">\n              <div style=\"padding:14px 20px 14px 0; text-align:right;\">\n                <div style=\"font-size:15.5px; line-height:1.5;\">{{ r.edom }}<\u002Fdiv>\n                <span sc-camel-on-click=\"{{ r.readE }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent); font-size:13px;\" style-hover=\"background:var(--color-accent-100);\">{{ r.refE }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-left:1px solid var(--color-neutral-300); border-right:1px solid var(--color-neutral-300); padding:10px 8px;\">\n                <div style=\"font-family:var(--font-heading); font-weight:600; font-size:14px; text-align:center;\">{{ r.era }}<\u002Fdiv>\n                <div style=\"font-size:18px; line-height:1; color:{{ r.arrowColor }};\">{{ r.arrow }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:14px 0 14px 20px;\">\n                <div style=\"font-size:15.5px; line-height:1.5;\">{{ r.israel }}<\u002Fdiv>\n                <span sc-camel-on-click=\"{{ r.readI }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent); font-size:13px;\" style-hover=\"background:var(--color-accent-100);\">{{ r.refI }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.55; margin:14px 0 0; max-width:72ch; color:var(--color-neutral-800);\">“The older shall serve the younger” (<span sc-camel-on-click=\"{{ v.g25_23 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">25:23<\u002Fspan>): the promise runs through Jacob. But God never stops calling Edom Israel’s brother (<span sc-camel-on-click=\"{{ v.dt23_7 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Deut. 23:7<\u002Fspan>), and in the end, crowds from Idumea come to hear Jesus (<span sc-camel-on-click=\"{{ v.mk3_8 }}\" style=\"cursor:pointer; color:var(--color-accent-700); border-bottom:1px dotted var(--color-accent);\" style-hover=\"background:var(--color-accent-100);\">Mark 3:8<\u002Fspan>).<\u002Fp>\n      <\u002Fsection>\n\n      <sc-if value=\"{{ showSources }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:56px;\">\n          <div style=\"font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:12px;\">Sources referenced<\u002Fdiv>\n          <div style=\"column-count:2; column-gap:36px; font-size:14px; line-height:1.5; color:var(--color-neutral-800);\">\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">K. A. Mathews, Genesis 11:27–50:26, New American Commentary (Nashville: B&amp;H, 2005).<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">John H. Walton, Genesis, NIV Application Commentary (Grand Rapids: Zondervan, 2001).<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">Dale Ralph Davis, God’s Rascal: The Jacob Narrative in Genesis 25–35. [Publisher and year to confirm from your copy.]<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">D. A. Carson et al., eds., New Bible Commentary: 21st Century Edition (Downers Grove: IVP, 1994).<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">John F. Walvoord and Roy B. Zuck, eds., The Bible Knowledge Commentary (Wheaton: Victor, 1985).<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">Joyce G. Baldwin, The Message of Genesis 12–50, Bible Speaks Today (Downers Grove: IVP, 1986).<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">John Calvin, Commentary on Genesis, vol. 2, on Genesis 34:1 (public domain; available at CCEL).<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">GotQuestions.org, “Why did God love Jacob and hate Esau?” and “Who were the Edomites?”<\u002Fp>\n            <p style=\"margin:0 0 8px; break-inside:avoid;\">BibleProject, “Genesis 12–50” (video) and the “Firstborn” podcast series.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex; justify-content:space-between; gap:12px; margin-top:56px;\">\n      <button sc-camel-on-click=\"{{ prevTab }}\" style=\"appearance:none; border:none; background:transparent; cursor:pointer; padding:8px 0; font-family:var(--font-heading); font-size:15px; font-weight:600; color:var(--color-accent-700);\" style-hover=\"color:var(--col
